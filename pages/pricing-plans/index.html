<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>价格方案</title>
<link rel="stylesheet" href="../_shared/themes.css">
<link rel="stylesheet" href="../_shared/base.css">
<style>
  @property --ang { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
  :root { --sh: color-mix(in srgb, var(--page-bg) 80%, transparent); }
  .stage { display: flex; flex-direction: column; align-items: center; padding: 2.8em 4em 2.2em;
    background: radial-gradient(ellipse 60% 60% at 50% 60%, color-mix(in srgb, var(--accent) 9%, var(--bg)), var(--bg) 75%); }
  .head { flex: none; text-align: center; opacity: 0; transform: translateY(.8em); transition: opacity .7s, transform .7s cubic-bezier(.2,.8,.2,1); }
  .head.on { opacity: 1; transform: none; }
  .head .sc-title { font-size: 2.3em; }
  .head .sc-sub { font-size: .95em; margin-top: .5em; }

  .tg { flex: none; display: flex; align-items: center; gap: 1em; margin-top: 1.3em; opacity: 0; transition: opacity .7s; }
  .tg.on { opacity: 1; }
  .seg { position: relative; display: flex; padding: .25em; background: var(--surface); border: 1px solid var(--line); border-radius: 2em; }
  .seg .th { position: absolute; top: .25em; bottom: .25em; left: .25em; width: calc((100% - .5em) / var(--n, 2)); border-radius: 2em; background: var(--accent); transform: translateX(calc(var(--i, 0) * 100%)); transition: transform .4s cubic-bezier(.3,.8,.2,1); }
  .seg button { position: relative; flex: 1; min-width: 5em; padding: .45em 1.2em; border: 0; background: none; font: inherit; font-size: .85em; color: var(--fg-soft); cursor: pointer; border-radius: 2em; transition: color .3s; }
  .seg button.on { color: var(--bg); font-weight: 700; }
  .seg.lock button { cursor: default; }
  .tnote { font-size: .72em; padding: .3em .9em; border-radius: 2em; color: var(--good); border: 1px solid color-mix(in srgb, var(--good) 50%, transparent); background: color-mix(in srgb, var(--good) 10%, transparent); }

  .cards { flex: 1; min-height: 0; width: 100%; display: flex; justify-content: center; align-items: flex-start; gap: 1.6em; padding: 1.6em 0 1em; }
  .cards.fit { align-items: stretch; }
  .card { --pk: 3; position: relative; isolation: isolate; flex: 1 1 0; max-width: 17em; min-width: 0; font-size: calc(1em * var(--k, 1)); display: flex; flex-direction: column; padding: 1.5em 1.4em 1.3em;
    border: 1px solid var(--line); border-radius: 1em; box-shadow: 0 1em 2.4em var(--sh); opacity: 0; transform: translateY(3em); transition: opacity .7s, transform .8s cubic-bezier(.2,.8,.2,1); }
  .card::after { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; background: var(--surface); }
  .card.on { opacity: 1; transform: none; }
  .card.hl { border-color: transparent; max-width: 18.5em; box-shadow: 0 1.4em 3.4em var(--sh), 0 0 3em color-mix(in srgb, var(--accent) 22%, transparent); }
  .card.hl.on { transform: translateY(-.8em) scale(1.04); }
  .card.hl::before { content: ""; position: absolute; inset: -.16em; z-index: -2; border-radius: 1.1em; background: conic-gradient(from var(--ang), var(--accent), var(--accent-2), var(--accent-3), var(--accent)); animation: spin calc(5s / var(--speed)) linear infinite; }
  @keyframes spin { to { --ang: 360deg; } }
  .badge { position: absolute; top: 0; left: 50%; transform: translate(-50%, -50%); white-space: nowrap; font-size: .7em; letter-spacing: .06em; padding: .3em 1.1em; border-radius: 2em; background: var(--accent); color: var(--bg); font-weight: 700; }
  .nm { font-family: var(--font-display); font-weight: 700; font-size: 1.3em; }
  .ds { color: var(--fg-soft); font-size: .8em; margin-top: .3em; min-height: 2.8em; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .pr { display: flex; align-items: baseline; gap: .15em; margin: .6em 0 .9em; white-space: nowrap; }
  .pr .cur { font-size: 1.1em; color: var(--accent); font-weight: 700; }
  .pr .amt { font-family: var(--font-display); font-weight: 700; font-size: calc(var(--pk) * 1em); line-height: 1; font-variant-numeric: tabular-nums; }
  .pr .amt.txt { font-size: 2em; }
  .pr .un { color: var(--fg-soft); font-size: .8em; margin-left: .2em; }
  .card ul { list-style: none; margin: 0; padding: .9em 0 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: .55em; font-size: .85em; }
  .card li { display: flex; gap: .6em; align-items: flex-start; line-height: 1.35; opacity: 0; transform: translateX(-.6em); transition: opacity .4s, transform .5s cubic-bezier(.2,.8,.2,1); }
  .card li.on { opacity: 1; transform: none; }
  .card li.off { color: var(--fg-soft); text-decoration: line-through; text-decoration-color: var(--line); }
  .card li svg { flex: none; width: 1.1em; height: 1.1em; margin-top: .1em; fill: none; stroke: var(--good); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .card li.off svg { stroke: var(--fg-soft); }
  .card li svg path { stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset .45s .1s ease-out; }
  .card li.on svg path { stroke-dashoffset: 0; }
  .cta { margin-top: auto; padding: .7em 1em; text-align: center; border-radius: .6em; font-size: .9em; font-weight: 700; border: 1px solid var(--line); color: var(--fg); background: transparent; font-family: inherit; cursor: pointer; transition: border-color .25s, transform .15s; }
  .cta:hover { border-color: var(--accent); }
  .cta:active { transform: scale(.97); }
  .card.hl .cta { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .sp { flex: 1; min-height: .8em; }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script src="../_shared/core.js"></script>
<script src="../_shared/player.js"></script>
<script src="config.js"></script>
<script src="page.js"></script>
</body>
</html>
