<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SlideCraft · 单页特效模板</title>
<style>
  :root { --bg:#14120f; --side:#1a1713; --surface:#221e18; --line:#332e26; --fg:#f1ece1; --soft:#9a9384; --accent:#e8b84a; --side-w:300px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden;
    font: 14px/1.5 "Inter", "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .app { display: grid; grid-template-columns: var(--side-w) 1fr; height: 100%; }

  /* 侧栏 */
  aside { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  aside header { padding: 18px 18px 12px; }
  aside h1 { margin: 0; font-size: 17px; letter-spacing: .01em; }
  aside header p { margin: 2px 0 0; color: var(--soft); font-size: 12px; }
  .search { margin: 0 14px 8px; padding: 8px 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; color: var(--fg); font: inherit; width: calc(100% - 28px); outline: none; }
  .search:focus { border-color: var(--accent); }
  nav { flex: 1; overflow-y: auto; padding: 0 8px 14px; }
  nav h2 { margin: 14px 10px 4px; font-size: 11px; font-weight: 600; letter-spacing: .12em; color: var(--soft); text-transform: uppercase; }
  .item { display: block; width: 100%; text-align: left; background: none; border: 0; border-radius: 8px; padding: 8px 10px; transition: background .15s; }
  .item:hover { background: var(--surface); }
  .item.on { background: var(--surface); box-shadow: inset 2px 0 0 var(--accent); }
  .item b { display: block; font-weight: 600; }
  .item span { display: block; color: var(--soft); font-size: 12px; }
  .item .tag { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 99px; border: 1px solid var(--line); font-size: 10px; font-weight: 400; color: var(--soft); vertical-align: 1px; }
  .empty { padding: 20px; color: var(--soft); text-align: center; }

  /* 主区 */
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .bar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .bar .name { font-weight: 600; font-size: 15px; }
  .bar .path { color: var(--soft); font: 12px ui-monospace, monospace; }
  .sp { flex: 1; }
  .grp { display: flex; align-items: center; gap: 4px; }
  .grp label { color: var(--soft); font-size: 12px; margin-right: 2px; }
  .chip { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; font-size: 12px; }
  .chip:hover { border-color: #5a5042; }
  .chip.on { border-color: var(--accent); color: var(--accent); }
  .view { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 18px; position: relative; }
  .frame { aspect-ratio: 16 / 9; width: min(100%, calc((100vh - 130px) * 16 / 9)); border-radius: 10px; overflow: hidden; background: #000;
    box-shadow: 0 20px 60px rgba(0,0,0,.55); border: 1px solid var(--line); }
  .frame iframe { width: 100%; height: 100%; border: 0; display: block; }
  .foot { padding: 0 16px 10px; color: var(--soft); font-size: 12px; display: flex; gap: 14px; flex-wrap: wrap; }
  .foot kbd { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font: 11px ui-monospace, monospace; }
  .foot a { color: var(--accent); text-decoration: none; }

  body.full .app { grid-template-columns: 0 1fr; }
  body.full aside, body.full .bar, body.full .foot { display: none; }
  body.full .view { padding: 0; }
  body.full .frame { width: min(100vw, 100vh * 16 / 9); border: 0; border-radius: 0; box-shadow: none; }
  .exit { display: none; position: fixed; top: 10px; right: 10px; z-index: 5; opacity: .35; }
  .exit:hover { opacity: 1; }
  body.full .exit { display: block; }
  @media (max-width: 860px) { :root { --side-w: 220px; } .item span { display: none; } }
</style>
</head>
<body>
<div class="app">
  <aside>
    <header>
      <h1>单页特效模板</h1>
      <p id="count"></p>
    </header>
    <input class="search" id="q" placeholder="搜索页面…" aria-label="搜索页面">
    <nav id="nav"></nav>
  </aside>
  <main>
    <div class="bar">
      <span class="name" id="name"></span>
      <span class="path" id="path"></span>
      <span class="sp"></span>
      <span class="grp" id="themes"><label>主题</label></span>
      <span class="grp" id="speeds"><label>速度</label></span>
      <button class="chip" id="replay">重播</button>
      <button class="chip" id="full">全屏</button>
      <a class="chip" id="open" target="_blank" style="text-decoration:none;color:inherit">新窗口</a>
    </div>
    <div class="view"><div class="frame"><iframe id="fr" title="预览" allow="autoplay"></iframe></div></div>
    <div class="foot" id="foot"></div>
  </main>
</div>
<button class="chip exit" id="exit">退出全屏 (Esc)</button>

<script>
/* ===== 目录：新增页面只需在这里加一行 =====
 * dir 是 pages/ 下的目录名；shared:false 表示该页面尚未迁移到共用底座，主题/速度参数不生效。 */
const GROUPS = [
  { name: "开场与封面", items: [
    { dir: "hero-intro", title: "开场封面", desc: "粒子、渐变、网格、圆环背景" },
    { dir: "countdown", title: "倒计时", desc: "翻页数字，可指定日期" },
    { dir: "kinetic-type", title: "动态排版", desc: "预告片式大字：冲击、滑入、回声、拆字" },
    { dir: "logo-reveal", title: "品牌 Logo 揭示", desc: "描边画出轮廓、填充、高光扫过" },
    { dir: "chapter-title", title: "章节转场页", desc: "巨大章节序号滚动，色块或线条背景" },
    { dir: "title-split", title: "分屏标题入场", desc: "竖带依次上滑拼成标题" }
  ]},
  { name: "文字与排版", items: [
    { dir: "text-reveal", title: "逐句文案", desc: "打字、遮罩、逐词、Glitch 等切换" },
    { dir: "quote-carousel", title: "金句轮播", desc: "逐字显现，进度条，圆点跳转" },
    { dir: "marquee", title: "滚动跑马灯", desc: "多行无限滚动的文字与 Logo" },
    { dir: "particle-text", title: "粒子成字", desc: "粒子聚成文字，鼠标可冲散" },
    { dir: "credits-roll", title: "片尾滚动字幕", desc: "片尾滚动字幕" },
    { dir: "danmaku", title: "弹幕墙", desc: "多轨道弹幕飞过" },
    { dir: "word-cloud", title: "词云", desc: "按权重螺旋摆放的词云" },
    { dir: "matrix-rain", title: "字符雨", desc: "字符雨背景加标题" }
  ]},
  { name: "数据可视化", items: [
    { dir: "number-counter", title: "数字滚动", desc: "大数字依次滚动到目标值" },
    { dir: "chart-animated", title: "动态图表", desc: "柱状图、折线图、环形图生长动画" },
    { dir: "bar-race", title: "排行榜赛跑", desc: "条形随时间重排" },
    { dir: "radar-chart", title: "雷达图", desc: "多系列多边形生长，悬停高亮、点击开关" },
    { dir: "funnel-chart", title: "漏斗图", desc: "阶段转化率，梯形依次展开" },
    { dir: "gantt-schedule", title: "甘特图", desc: "条形生长，进度填充，今日线扫过" },
    { dir: "gauge-dashboard", title: "仪表盘", desc: "指针或弧线仪表，分区着色" },
    { dir: "progress-rings", title: "进度环组", desc: "嵌套进度环" },
    { dir: "heatmap-calendar", title: "热力日历", desc: "贡献图式热力日历" },
    { dir: "sankey-flow", title: "桑基图", desc: "桑基图，流量带依次展开" },
    { dir: "treemap", title: "矩形树图", desc: "矩形树图，面积表示数值" },
    { dir: "stock-ticker", title: "行情滚动条", desc: "行情滚动条加实时折线" }
  ]},
  { name: "流程与结构", items: [
    { dir: "timeline", title: "时间线", desc: "事件依次点亮，可点击跳转" },
    { dir: "flow-diagram", title: "流程 / 架构图", desc: "节点出现，数据光点沿连线流动" },
    { dir: "step-tour", title: "步骤导览", desc: "聚光灯依次高亮界面区域" },
    { dir: "orbit-map", title: "轨道式生态图", desc: "同心轨道旋转，悬停查看说明" },
    { dir: "org-chart", title: "组织架构树", desc: "组织架构树，可折叠展开" },
    { dir: "mind-map", title: "思维导图", desc: "思维导图，分支逐层生长" },
    { dir: "roadmap", title: "产品路线图", desc: "季度路线图，状态与进度" },
    { dir: "swimlane", title: "泳道流程图", desc: "跨角色泳道流程图" },
    { dir: "decision-tree", title: "决策树", desc: "决策树，沿选择路径高亮" },
    { dir: "swot-matrix", title: "四象限矩阵", desc: "SWOT 四象限与散点" },
    { dir: "layer-stack", title: "分层架构图", desc: "分层架构图，点击放大一层" }
  ]},
  { name: "媒体与图片", items: [
    { dir: "gallery", title: "图片展示墙", desc: "16 张图错落入场，悬停倾斜，点击放大", shared: false },
    { dir: "media-wall", title: "媒体墙（可配置）", desc: "图片、动图、视频网格，灯箱浏览" },
    { dir: "compare-slider", title: "前后对比滑块", desc: "拖动分隔线对比两张图，自动扫动" },
    { dir: "carousel-3d", title: "3D 图片轮播", desc: "封面流与环形两种样式，拖动、方向键切换" },
    { dir: "polaroid-scatter", title: "拍立得散落", desc: "拍立得散落桌面" },
    { dir: "parallax-layers", title: "视差分层", desc: "鼠标驱动的视差分层" },
    { dir: "flip-cards", title: "翻转卡片", desc: "3D 翻转卡片" },
    { dir: "zoom-lens", title: "放大镜细节", desc: "放大镜巡游细节" },
    { dir: "video-frame", title: "设备相框视频", desc: "笔记本、手机、电视外框加标注线" }
  ]},
  { name: "产品与界面演示", items: [
    { dir: "chat-sim", title: "Claude Code 对话模拟", desc: "逐字输出、工具调用、diff 代码块", shared: false },
    { dir: "terminal-demo", title: "终端演示", desc: "敲命令、输出日志、进度条" },
    { dir: "browser-demo", title: "浏览器 / 手机演示", desc: "截图轮播加模拟光标点击" },
    { dir: "code-showcase", title: "代码演示", desc: "语法高亮，逐步 diff，聚焦区域" },
    { dir: "phone-scroll", title: "手机长图滚动", desc: "手机里滚动长截图，停靠批注" },
    { dir: "notification-stack", title: "通知堆叠", desc: "系统通知依次弹出堆叠" },
    { dir: "command-palette", title: "命令面板", desc: "命令面板输入、过滤、执行" },
    { dir: "chat-bubbles", title: "聊天气泡", desc: "聊天气泡，输入中动画" },
    { dir: "api-playground", title: "接口调试", desc: "接口调试：请求与响应" },
    { dir: "live-dashboard", title: "实时监控面板", desc: "实时监控面板，异常告警" },
    { dir: "form-wizard", title: "表单向导", desc: "多步表单自动填写" }
  ]},
  { name: "信息版式", items: [
    { dir: "bento-grid", title: "便当盒仪表盘", desc: "数字、文字、图片、迷你折线混排的磁贴" },
    { dir: "team-cards", title: "团队介绍", desc: "头像卡片聚光灯轮流展开" },
    { dir: "pricing-plans", title: "价格方案", desc: "高亮方案渐变边框，月付年付切换" },
    { dir: "faq-accordion", title: "问答折叠", desc: "问答手风琴" },
    { dir: "feature-table", title: "功能对比表", desc: "功能对比表，推荐列高亮" },
    { dir: "checklist-progress", title: "清单进度", desc: "清单逐项勾选，总进度增长" },
    { dir: "testimonial-wall", title: "评价墙", desc: "评价墙，多列反向滚动" },
    { dir: "stat-compare", title: "数字对比", desc: "左右大数字对比与差值" },
    { dir: "agenda-list", title: "议程目录", desc: "议程目录，当前项高亮" }
  ]},
  { name: "3D 与氛围", items: [
    { dir: "globe-arcs", title: "旋转地球飞线", desc: "点阵地球、城市涟漪、大圆弧线，可拖动" },
    { dir: "tag-sphere", title: "3D 标签球", desc: "3D 标签球" },
    { dir: "aurora-bg", title: "极光背景", desc: "极光流动渐变背景" },
    { dir: "cube-rotate", title: "立方体翻面", desc: "3D 立方体翻面" },
    { dir: "ripple-grid", title: "波纹点阵", desc: "点阵波纹" },
    { dir: "terrain-lines", title: "山脉线条", desc: "线条山脉" },
    { dir: "isometric-city", title: "等距城市", desc: "等距方块城市升起" }
  ]}
];
const THEMES = ["dark", "light", "paper", "neon", "terminal"];
const SPEEDS = [0.5, 1, 2, 4];

const $ = (s) => document.querySelector(s);
const all = GROUPS.flatMap((g) => g.items);
let cur = all[0], theme = null, speed = 1;

/* URL hash 记住当前页：#timeline?theme=light */
function readHash() {
  const [d, qs] = location.hash.slice(1).split("?");
  const p = new URLSearchParams(qs || "");
  const f = all.find((x) => x.dir === d);
  if (f) cur = f;
  theme = p.get("theme") || null;
  speed = +p.get("speed") || 1;
}
function writeHash() {
  const p = new URLSearchParams();
  if (theme) p.set("theme", theme);
  if (speed !== 1) p.set("speed", speed);
  const qs = p.toString();
  history.replaceState(null, "", "#" + cur.dir + (qs ? "?" + qs : ""));
}
function url(chrome = true) {
  const p = new URLSearchParams();
  if (cur.shared !== false) {
    if (theme) p.set("theme", theme);
    if (speed !== 1) p.set("speed", speed);
    if (!chrome) p.set("controls", "0");
  }
  const qs = p.toString();
  return cur.dir + "/index.html" + (qs ? "?" + qs : "");
}

function buildNav(filter = "") {
  const f = filter.trim().toLowerCase();
  let html = "", n = 0;
  for (const g of GROUPS) {
    const rows = g.items.filter((x) => !f || (x.title + x.desc + x.dir).toLowerCase().includes(f));
    if (!rows.length) continue;
    html += `<h2>${g.name}</h2>` + rows.map((x) => {
      n++;
      return `<button class="item${x === cur ? " on" : ""}" data-d="${x.dir}"><b>${x.title}${x.shared === false ? '<i class="tag">独立</i>' : ""}</b><span>${x.desc}</span></button>`;
    }).join("");
  }
  $("#nav").innerHTML = html || '<div class="empty">没有匹配的页面</div>';
  $("#count").textContent = `${all.length} 个页面 · ${GROUPS.length} 类`;
}

function buildChips() {
  const shared = cur.shared !== false;
  $("#themes").innerHTML = '<label>主题</label>' + (shared
    ? THEMES.map((t) => `<button class="chip${theme === t ? " on" : ""}" data-t="${t}">${t}</button>`).join("")
    : '<span class="path">此页自带配色</span>');
  $("#speeds").innerHTML = '<label>速度</label>' + (shared
    ? SPEEDS.map((s) => `<button class="chip${speed === s ? " on" : ""}" data-s="${s}">${s}×</button>`).join("")
    : '<span class="path">用页内按钮</span>');
}

function load() {
  $("#fr").src = url(!document.body.classList.contains("full"));
  $("#name").textContent = cur.title;
  $("#path").textContent = "pages/" + cur.dir + "/";
  $("#open").href = url();
  $("#foot").innerHTML = `<span>${cur.desc}</span>
    <span>改内容：<a href="${cur.dir}/${cur.dir === "chat-sim" ? "conversation.js" : cur.dir === "gallery" ? "index.html" : "config.js"}" target="_blank">${cur.dir === "chat-sim" ? "conversation.js" : cur.dir === "gallery" ? "index.html 里的 CONFIG" : "config.js"}</a></span>
    <span><kbd>↑</kbd><kbd>↓</kbd> 切换页面 · <kbd>F</kbd> 全屏 · <kbd>空格</kbd> 暂停 · <kbd>R</kbd> 重播</span>`;
  buildNav($("#q").value); buildChips(); writeHash();
}
function select(d) { cur = all.find((x) => x.dir === d); if (cur.shared === false) { theme = null; speed = 1; } load(); }
function step(k) { select(all[(all.indexOf(cur) + k + all.length) % all.length].dir); }
function cmd(c, value) { $("#fr").contentWindow.postMessage({ sc: "cmd", cmd: c, value }, "*"); }

$("#nav").onclick = (e) => { const b = e.target.closest(".item"); if (b) select(b.dataset.d); };
$("#q").oninput = (e) => buildNav(e.target.value);
$("#themes").onclick = (e) => { const b = e.target.closest("[data-t]"); if (!b) return; theme = theme === b.dataset.t ? null : b.dataset.t; load(); };
$("#speeds").onclick = (e) => { const b = e.target.closest("[data-s]"); if (!b) return; speed = +b.dataset.s; buildChips(); writeHash(); cmd("speed", speed); };
$("#replay").onclick = () => { cmd("replay"); if (cur.shared === false) $("#fr").src = url(); };
function setFull(v) { document.body.classList.toggle("full", v); if (v) document.documentElement.requestFullscreen?.().catch(() => {}); else if (document.fullscreenElement) document.exitFullscreen(); load(); }
$("#full").onclick = () => setFull(true);
$("#exit").onclick = () => setFull(false);
document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement && document.body.classList.contains("full")) setFull(false); });
addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT") { if (e.key === "Escape") e.target.blur(); return; }
  if (e.key === "ArrowDown") { e.preventDefault(); step(1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); step(-1); }
  else if (e.key === "f" || e.key === "F") setFull(!document.body.classList.contains("full"));
  else if (e.key === "Escape" && document.body.classList.contains("full")) setFull(false);
  else if (e.key === "/") { e.preventDefault(); $("#q").focus(); }
});
/* iframe 获得焦点时，键盘事件不会冒泡到这里，所以 iframe 加载后把焦点还给外层 */
$("#fr").addEventListener("load", () => { try { $("#fr").blur(); window.focus(); } catch (e) {} });

readHash(); load();
</script>
</body>
</html>
