<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>弹幕墙</title>
<link rel="stylesheet" href="../_shared/themes.css">
<link rel="stylesheet" href="../_shared/base.css">
<style>
  .layer { position: absolute; inset: 0; z-index: 1; opacity: 0; transition: opacity .8s;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 7%, #000 93%, transparent);
    mask-image: linear-gradient(90deg, transparent, #000 7%, #000 93%, transparent); }
  .layer.on { opacity: 1; }
  .dm { position: absolute; left: 0; top: 0; width: max-content; will-change: transform; }
  .pill { transform: translateY(-50%); display: flex; align-items: center; gap: .6em; max-width: 34em; padding: .55em 1.2em;
    border-radius: 99em; background: var(--surface); border: 1px solid var(--line); color: var(--fg-soft); white-space: nowrap;
    box-shadow: 0 .3em 1em color-mix(in srgb, var(--fg) 8%, transparent); }
  .pill::before { content: ""; flex: none; width: .5em; height: .5em; border-radius: 50%; background: var(--c, var(--accent-3)); }
  .pill .tx { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .pill .by { flex: none; font-family: var(--font-mono); font-size: .75em; opacity: .8; }
  .pill.hl { font-size: 1.25em; font-weight: 600; color: var(--fg); border-color: var(--accent);
    box-shadow: 0 .4em 1.6em color-mix(in srgb, var(--accent) 30%, transparent); }
  .pill.hl::before { width: .55em; height: .55em; background: var(--accent); }

  .head { position: absolute; inset: 0; z-index: 2; display: flex; align-items: center; justify-content: center; text-align: center; pointer-events: none; }
  .hd { padding: 3.5em 7em; max-width: 52em; background: radial-gradient(closest-side, var(--bg) 55%, transparent); opacity: 0; transform: translateY(.8em) scale(.97); transition: opacity .9s, transform 1.1s cubic-bezier(.2,.7,.2,1); }
  .hd.on { opacity: 1; transform: none; }
  .hd .sc-title { font-size: 3.6em; letter-spacing: -.01em; overflow-wrap: anywhere; }
  .hd .sc-sub { font-size: 1.15em; margin-top: .7em; overflow-wrap: anywhere; }
  .hd .sc-eyebrow { margin-bottom: 1em; }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script src="../_shared/core.js"></script>
<script src="../_shared/player.js"></script>
<script src="config.js"></script>
<script src="page.js"></script>
</body>
</html>
