<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>神经网络前向传播</title>
<link rel="stylesheet" href="../_shared/themes.css">
<link rel="stylesheet" href="../_shared/base.css">
<style>
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .hd { position: absolute; left: 4em; top: 2.6em; z-index: 2; max-width: 34em; }
  .hd > * { animation: rise calc(.7s / var(--speed)) cubic-bezier(.2,.7,.2,1) both; }
  .hd > :nth-child(2) { animation-delay: calc(.08s / var(--speed)); }
  .hd > :nth-child(3) { animation-delay: calc(.16s / var(--speed)); }
  @keyframes rise { from { opacity: 0; transform: translateY(.6em); } }

  .col { position: absolute; top: 33%; bottom: 6%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; }
  .col .name { position: absolute; top: -2.4em; font: 600 .8em var(--font-mono); letter-spacing: .08em; color: var(--fg-soft); white-space: nowrap; }
  .col .stack { flex: 1; display: flex; flex-direction: column; justify-content: space-evenly; align-items: center; }
  .node { position: relative; width: 2.1em; height: 2.1em; border-radius: 50%; background: var(--surface); border: 2px solid var(--line);
    box-shadow: 0 0 0 0 var(--accent); transition: border-color calc(.3s / var(--speed)), box-shadow calc(.3s / var(--speed)), transform calc(.3s / var(--speed)); }
  .node.lit { border-color: var(--accent); box-shadow: 0 0 .9em .15em color-mix(in srgb, var(--accent) 55%, transparent); }
  .node.hot { transform: scale(1.18); }
  .node.win { border-color: var(--accent); border-width: 3px; transform: scale(1.25);
    box-shadow: 0 0 1.4em .3em color-mix(in srgb, var(--accent) 70%, transparent); }
  .node .lab { position: absolute; left: 50%; top: 3.1em; transform: translateX(-50%); font-size: .72em; color: var(--fg-soft);
    white-space: nowrap; text-align: center; }
  .node .prob { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font: 700 .62em var(--font-mono); color: var(--fg); opacity: 0; }
  .node.show .prob { animation: fade calc(.5s / var(--speed)) forwards; }
  @keyframes fade { to { opacity: 1; } }

  .badge { position: absolute; z-index: 3; padding: .5em .9em; border-radius: .6em; background: var(--accent); color: var(--bg);
    font-weight: 700; font-size: .95em; white-space: nowrap; opacity: 0; transform: translateY(.4em); }
  .badge.on { animation: fadeup calc(.5s / var(--speed)) forwards; }
  @keyframes fadeup { to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script src="../_shared/core.js"></script>
<script src="../_shared/player.js"></script>
<script src="config.js"></script>
<script src="page.js"></script>
</body>
</html>
