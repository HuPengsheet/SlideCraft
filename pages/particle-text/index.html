<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>粒子成字</title>
<link rel="stylesheet" href="../_shared/themes.css">
<link rel="stylesheet" href="../_shared/base.css">
<style>
  .stage { touch-action: none; cursor: crosshair; }
  .stage::before { content: ""; position: absolute; inset: 0; background: radial-gradient(closest-side at 50% 48%, var(--surface), transparent); opacity: .8; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .cap { position: absolute; left: 0; right: 0; bottom: 5em; text-align: center; color: var(--fg-soft); font-size: 1.2em; letter-spacing: .3em; opacity: 0; transition: opacity 1s; padding: 0 4em; overflow-wrap: anywhere; }
  .cap.on { opacity: 1; }
  .hint { position: absolute; left: 0; right: 0; bottom: 2em; text-align: center; color: var(--fg-soft); font-size: .7em; letter-spacing: .2em; opacity: 0; transition: opacity 1s; }
  .hint.on { opacity: .6; }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script src="../_shared/core.js"></script>
<script src="../_shared/player.js"></script>
<script src="config.js"></script>
<script src="page.js"></script>
</body>
</html>
