<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>矩形树图</title>
<link rel="stylesheet" href="../_shared/themes.css">
<link rel="stylesheet" href="../_shared/base.css">
<style>
  .stage { display: flex; flex-direction: column; gap: 1.2em; padding: 3.2em 4.5em 2.6em; }
  .rise { opacity: 0; animation: rise calc(.8s / var(--speed)) cubic-bezier(.2,.7,.2,1) forwards; animation-delay: calc(var(--d, 0s) / var(--speed)); }
  @keyframes rise { from { opacity: 0; transform: translateY(.7em); } to { opacity: 1; transform: none; } }
  .nomo .rise, .nomo .tile { animation: none; opacity: 1; transform: none; }
  .top { display: flex; align-items: flex-end; justify-content: space-between; gap: 3em; flex: none; }
  .top .sc-title { font-size: 2.3em; }
  .big { text-align: right; flex: none; }
  .big b { display: block; font-family: var(--font-display); font-size: 3.4em; line-height: 1; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .big span { display: block; margin-top: .3em; color: var(--fg-soft); font-size: .8em; }
  .plot { flex: 1; min-height: 0; position: relative; border-radius: .7em; overflow: hidden; background: var(--bg); box-shadow: 0 1.2em 3em -1.6em var(--fg), 0 0 0 1px var(--line); }
  .tile { position: absolute; padding: .55em .7em; overflow: hidden; color: var(--fg); background: var(--c); border-top: .22em solid var(--b); box-shadow: inset 0 0 0 .1em var(--bg); opacity: 0; transform: scale(.82); transition: opacity .25s, filter .25s; animation: pop calc(.6s / var(--speed)) cubic-bezier(.2,.9,.3,1.1) forwards; animation-delay: calc(var(--d) * 1s / var(--speed)); cursor: default; }
  @keyframes pop { from { opacity: 0; transform: scale(.82); } to { opacity: 1; transform: none; } }
  .has-hl .tile:not(.hl) { opacity: .45 !important; }
  .tile.hl { filter: brightness(1.12); z-index: 2; }
  .tile .n { font-family: var(--font-display); font-weight: 700; line-height: 1.15; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; word-break: break-all; }
  .tile .v { margin-top: .3em; font-family: var(--font-mono); font-size: .72em; color: var(--fg-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .foot { display: flex; align-items: center; justify-content: space-between; gap: 2em; flex: none; font-size: .78em; color: var(--fg-soft); }
  .legend { display: flex; flex-wrap: wrap; gap: .5em 1.6em; }
  .legend span { white-space: nowrap; }
  .legend i { display: inline-block; width: .9em; height: .9em; border-radius: .25em; background: var(--b); margin-right: .5em; vertical-align: -.1em; }
  .legend em { font-style: normal; font-family: var(--font-mono); margin-left: .5em; opacity: .7; }
  .note { margin: 0; border-left: .2em solid var(--accent); padding-left: .9em; text-align: left; max-width: 38%; }
  .empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--fg-soft); }
  .tip { position: absolute; z-index: 10; pointer-events: none; padding: .55em .85em; background: var(--fg); color: var(--bg); border-radius: .5em; font-size: .8em; white-space: nowrap; box-shadow: 0 .6em 1.6em -.4em var(--bg); opacity: 0; transition: opacity .15s; }
  .tip.show { opacity: 1; }
  .tip b { font-family: var(--font-mono); margin-left: .7em; }
  .tip i { font-style: normal; opacity: .65; margin-left: .5em; }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script src="../_shared/core.js"></script>
<script src="../_shared/player.js"></script>
<script src="config.js"></script>
<script src="page.js"></script>
</body>
</html>
