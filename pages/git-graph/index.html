<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Git 分支图</title>
<link rel="stylesheet" href="../_shared/themes.css">
<link rel="stylesheet" href="../_shared/base.css">
<style>
  .stage svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .hd { position: absolute; left: 4em; top: 3em; z-index: 2; max-width: 40em; }
  .hd > * { animation: rise calc(.7s / var(--speed)) cubic-bezier(.2,.7,.2,1) both; }
  .hd > :nth-child(2) { animation-delay: calc(.08s / var(--speed)); }
  .hd > :nth-child(3) { animation-delay: calc(.16s / var(--speed)); }
  @keyframes rise { from { opacity: 0; transform: translateY(.6em); } }

  .guide { stroke: var(--line); stroke-width: 2; stroke-dasharray: 4 12; opacity: 0; }
  .guide.on { animation: fade calc(.6s / var(--speed)) forwards; }
  .bp { opacity: 0; }
  .bp.on { animation: fade calc(.45s / var(--speed)) forwards; }
  .bp rect { fill: var(--surface); stroke: var(--c); stroke-width: 2; }
  .bp text { fill: var(--c); font: 600 20px var(--font-mono); }
  @keyframes fade { to { opacity: 1; } }

  .edge { fill: none; stroke: var(--c); stroke-width: 5; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; }
  .edge.on { animation: draw calc(var(--d, .5s) / var(--speed)) ease-out forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  .dot { fill: var(--bg); stroke: var(--c); stroke-width: 5; transform-box: fill-box; transform-origin: center; transform: scale(0); }
  .dot.merge { fill: var(--c); }
  .dot.on { animation: pop calc(.45s / var(--speed)) cubic-bezier(.3,1.6,.5,1) forwards; }
  @keyframes pop { to { transform: scale(1); } }
  .head { fill: none; stroke: var(--c); stroke-width: 3; transform-box: fill-box; transform-origin: center; opacity: 0; }
  .head.on { animation: ring calc(1.8s / var(--speed)) ease-out infinite; }
  @keyframes ring { from { opacity: .8; transform: scale(1); } to { opacity: 0; transform: scale(2.4); } }

  .lab, .tag { opacity: 0; }
  .lab.on, .tag.on { animation: lab calc(.45s / var(--speed)) ease-out forwards; }
  @keyframes lab { from { opacity: 0; transform: translateY(var(--dy, 8px)); } to { opacity: 1; transform: none; } }
  .lab .msg { fill: var(--fg); font: 500 20px var(--font-body); text-anchor: middle; }
  .lab .hash { fill: var(--fg-soft); font: 17px var(--font-mono); text-anchor: middle; }
  .tag rect { fill: var(--accent); }
  .tag text { fill: var(--bg); font: 700 18px var(--font-mono); }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script src="../_shared/core.js"></script>
<script src="../_shared/player.js"></script>
<script src="config.js"></script>
<script src="page.js"></script>
</body>
</html>
