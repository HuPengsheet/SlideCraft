<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>流程图</title>
<link rel="stylesheet" href="../_shared/themes.css">
<link rel="stylesheet" href="../_shared/base.css">
<style>
  .head { position: absolute; left: 4em; top: 2.6em; z-index: 3; }
  .head .sc-title { font-size: 2em; }
  svg.edges { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; overflow: visible; }
  .edge { fill: none; stroke: var(--line); stroke-width: .3; stroke-linecap: round; }
  .edge.hl { stroke: var(--fg-soft); }
  .arrow { fill: var(--fg-soft); opacity: 0; transition: opacity .3s; }
  .arrow.on { opacity: 1; }
  .dot { fill: var(--accent); filter: drop-shadow(0 0 .5em var(--accent)) drop-shadow(0 0 .2em var(--accent)); }
  .dot.d2 { fill: var(--accent-2); filter: drop-shadow(0 0 .5em var(--accent-2)); }
  .node, .elabel { position: absolute; z-index: 2; transform: translate(-50%, -50%); }
  .node { min-width: 9em; max-width: 14em; padding: .9em 1.3em; text-align: center; opacity: 0; transition: opacity .5s, transform .5s cubic-bezier(.2,.7,.2,1); transform: translate(-50%, -50%) scale(.85); }
  .node.on { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .node .ic { font-size: 1.8em; line-height: 1.1; margin-bottom: .15em; }
  .node .lb { font-family: var(--font-display); font-weight: 600; font-size: 1.15em; }
  .node .sb { color: var(--fg-soft); font-size: .75em; margin-top: .2em; }
  .node.accent { border-color: var(--accent); box-shadow: 0 0 1.6em -.4em var(--accent); }
  .node.accent .lb { color: var(--accent); }
  .node.muted { background: transparent; border-style: dashed; }
  .node.muted .lb { color: var(--fg-soft); }
  .elabel { font-size: .7em; color: var(--fg-soft); background: var(--bg); padding: .1em .6em; border-radius: 1em; border: 1px solid var(--line); opacity: 0; transition: opacity .4s; }
  .elabel.on { opacity: 1; }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script src="../_shared/core.js"></script>
<script src="../_shared/player.js"></script>
<script src="config.js"></script>
<script src="page.js"></script>
</body>
</html>
