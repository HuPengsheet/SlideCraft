<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>山脉线条</title>
<link rel="stylesheet" href="../_shared/themes.css">
<link rel="stylesheet" href="../_shared/base.css">
<style>
  .stage { background: var(--bg); }
  .tl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; opacity: 0; transition: opacity calc(1.4s / var(--speed)) ease; }
  .tl.on { opacity: 1; }
  .copy { position: absolute; left: 4.4em; top: 3.6em; max-width: 26em; pointer-events: none; z-index: 2; }
  .copy > * { opacity: 0; transform: translateY(.6em); transition: opacity calc(1s / var(--speed)) ease, transform calc(1s / var(--speed)) cubic-bezier(.2,.7,.2,1); }
  .copy.on > * { opacity: 1; transform: none; }
  .copy .sc-eyebrow { transition-delay: calc(.2s / var(--speed)); }
  .copy h1 { font-family: var(--font-display); font-weight: 800; font-size: 3.2em; line-height: 1.08; margin: .3em 0 0; letter-spacing: -.02em; text-wrap: balance; transition-delay: calc(.35s / var(--speed)); }
  .copy p { margin: .9em 0 0; color: var(--fg-soft); font-size: 1.05em; transition-delay: calc(.55s / var(--speed)); }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script src="../_shared/core.js"></script>
<script src="../_shared/player.js"></script>
<script src="config.js"></script>
<script src="page.js"></script>
</body>
</html>
