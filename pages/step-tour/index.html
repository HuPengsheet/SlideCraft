<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>步骤导览</title>
<link rel="stylesheet" href="../_shared/themes.css">
<link rel="stylesheet" href="../_shared/base.css">
<style>
  .shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; user-select: none; }
  .spot { position: absolute; border: .15em solid var(--accent); border-radius: .5em; z-index: 2; pointer-events: none;
    box-shadow: 0 0 0 0 transparent; opacity: 0;
    transition: left, top, width, height, opacity, box-shadow;
    transition-duration: calc(.7s / var(--speed)); transition-timing-function: cubic-bezier(.3,.7,.2,1); }
  .spot.on { opacity: 1; box-shadow: 0 0 0 100em color-mix(in srgb, var(--bg) 72%, transparent), 0 0 1.4em var(--accent); }
  .call { position: absolute; z-index: 3; width: 20em; padding: 1.1em 1.3em 1.2em; background: var(--surface);
    animation: pop calc(.5s / var(--speed)) cubic-bezier(.2,.7,.2,1) both; }
  .call .num { display: inline-flex; align-items: center; justify-content: center; width: 1.9em; height: 1.9em; border-radius: 50%;
    background: var(--accent); color: var(--bg); font-weight: 700; font-family: var(--font-display); margin-bottom: .5em; }
  .call h2 { margin: 0 0 .3em; font-family: var(--font-display); font-size: 1.3em; line-height: 1.2; }
  .call p { margin: 0; color: var(--fg-soft); font-size: .9em; }
  @keyframes pop { from { opacity: 0; margin-top: .8em; } to { opacity: 1; margin-top: 0; } }
  .nav { position: absolute; z-index: 4; left: 50%; bottom: 1.6em; transform: translateX(-50%); display: flex; gap: .7em; align-items: center;
    padding: .5em 1em; background: var(--surface); border: 1px solid var(--line); border-radius: 2em; }
  .nav button { width: .8em; height: .8em; padding: 0; border-radius: 50%; border: 0; background: var(--line); cursor: default; transition: background .3s, transform .3s; }
  .nav.ready button { cursor: pointer; }
  .nav button.on { background: var(--accent); transform: scale(1.35); }
  .nav button.past { background: var(--fg-soft); }
  .nav span { font-size: .7em; color: var(--fg-soft); font-variant-numeric: tabular-nums; margin-left: .3em; }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script src="../_shared/core.js"></script>
<script src="../_shared/player.js"></script>
<script src="config.js"></script>
<script src="page.js"></script>
</body>
</html>
