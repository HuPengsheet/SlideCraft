<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>表单向导</title>
<link rel="stylesheet" href="../_shared/themes.css">
<link rel="stylesheet" href="../_shared/base.css">
<style>
  :root { --sh: color-mix(in srgb, var(--page-bg) 80%, transparent); }
  .stage { display: flex; flex-direction: column; align-items: center; padding: 2.6em 4em 2.2em;
    background: radial-gradient(ellipse 60% 60% at 50% 100%, color-mix(in srgb, var(--accent) 9%, var(--bg)), var(--bg) 72%); }
  .head { flex: none; text-align: center; opacity: 0; transform: translateY(.8em); transition: opacity .7s, transform .7s cubic-bezier(.2,.8,.2,1); }
  .head.on { opacity: 1; transform: none; }
  .head .sc-title { font-size: 2.1em; }
  .head .sc-sub { font-size: .9em; }

  .steps { flex: none; width: 100%; max-width: 44em; display: flex; align-items: flex-start; margin-top: 1.5em; opacity: 0; transition: opacity .7s; }
  .steps.on { opacity: 1; }
  .sp { position: relative; flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: .4em; cursor: default; }
  .sp::before { content: ""; position: absolute; top: .95em; right: 50%; width: 100%; height: .16em; background: var(--line); z-index: 0; }
  .sp::after { content: ""; position: absolute; top: .95em; right: 50%; width: 100%; height: .16em; background: var(--accent); z-index: 0; transform: scaleX(0); transform-origin: right; transition: transform .6s cubic-bezier(.3,.8,.2,1); }
  .sp:first-child::before, .sp:first-child::after { display: none; }
  .sp.done::after, .sp.cur::after { transform: scaleX(1); transform-origin: left; }
  .sp .dot { position: relative; z-index: 1; width: 2em; height: 2em; border-radius: 50%; display: grid; place-items: center; font-size: .85em; font-weight: 700; background: var(--surface); border: .15em solid var(--line); color: var(--fg-soft); transition: all .4s; }
  .sp.cur .dot { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 .3em color-mix(in srgb, var(--accent) 22%, transparent); }
  .sp.done .dot { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  .sp.done { cursor: pointer; }
  .sp .nm { font-size: .72em; color: var(--fg-soft); text-align: center; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 .3em; transition: color .3s; }
  .sp.cur .nm { color: var(--fg); font-weight: 700; }

  .card { position: relative; flex: 1; min-height: 0; width: 100%; max-width: 44em; margin-top: 1.4em; overflow: hidden; background: var(--surface); border: 1px solid var(--line); border-radius: 1.1em; box-shadow: 0 1.4em 3.4em var(--sh);
    opacity: 0; transform: translateY(2em); transition: opacity .7s, transform .8s cubic-bezier(.2,.8,.2,1); }
  .card.on { opacity: 1; transform: none; }
  .slide { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 1.8em 2.2em 1.6em; overflow: hidden; transition: transform .6s cubic-bezier(.6,.05,.2,1), opacity .5s; }
  .slide.before { transform: translateX(-110%); opacity: 0; visibility: hidden; }
  .slide.after { transform: translateX(110%); opacity: 0; visibility: hidden; }
  .slide h2 { flex: none; margin: 0; font-family: var(--font-display); font-size: 1.5em; }
  .slide .desc { flex: none; color: var(--fg-soft); font-size: .85em; margin: .3em 0 0; }
  .fields { flex: 1; min-height: 0; overflow: auto; scrollbar-width: thin; display: flex; flex-direction: column; gap: 1em; margin-top: 1.2em; padding: .3em .3em .3em; }
  .fld { flex: none; display: flex; flex-direction: column; gap: .35em; min-width: 0; }
  .fld label { font-size: .72em; letter-spacing: .1em; color: var(--fg-soft); }
  .fld input, .fld textarea { width: 100%; font: inherit; font-size: .95em; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: .55em; padding: .65em .9em; outline: 0; resize: none; transition: border-color .25s, box-shadow .25s; pointer-events: none; }
  .fld textarea { height: 4.8em; line-height: 1.4; }
  .fld.focus input, .fld.focus textarea { border-color: var(--accent); box-shadow: 0 0 0 .22em color-mix(in srgb, var(--accent) 22%, transparent); }
  .fld.focus input, .fld.focus textarea { caret-color: var(--accent); }
  .acts { flex: none; display: flex; justify-content: flex-end; gap: .8em; margin-top: 1em; }
  .btn { font: inherit; font-size: .9em; font-weight: 700; padding: .7em 1.8em; border-radius: .6em; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; transition: transform .15s, box-shadow .3s, border-color .25s; }
  .btn.pri { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  .btn.hot { box-shadow: 0 0 0 .3em color-mix(in srgb, var(--accent) 30%, transparent), 0 0 1.6em color-mix(in srgb, var(--accent) 55%, transparent); }
  .btn.press { transform: scale(.93); }
  .btn:disabled { opacity: .5; cursor: default; }

  .ok { align-items: center; justify-content: center; text-align: center; }
  .ok svg { width: 5em; height: 5em; overflow: visible; }
  .ok .ring { fill: none; stroke: var(--good); stroke-width: 3; stroke-dasharray: 1; stroke-dashoffset: 1; }
  .ok .tick { fill: none; stroke: var(--good); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; }
  .ok .halo { fill: color-mix(in srgb, var(--good) 14%, transparent); transform-origin: center; transform: scale(0); transition: transform .8s cubic-bezier(.2,.9,.2,1.2); }
  .ok.go .halo { transform: scale(1); }
  .ok.go .ring { animation: draw calc(.7s / var(--speed)) ease-out forwards; }
  .ok.go .tick { animation: draw calc(.5s / var(--speed)) calc(.6s / var(--speed)) ease-out forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .ok h2 { margin-top: .6em; font-size: 1.8em; opacity: 0; transform: translateY(.6em); transition: opacity .6s .9s, transform .6s .9s; }
  .ok .desc { opacity: 0; transition: opacity .6s 1.1s; }
  .ok.go h2, .ok.go .desc { opacity: 1; transform: none; }
  .sum { margin-top: 1.1em; width: 100%; max-width: 30em; max-height: 38%; overflow: auto; scrollbar-width: thin; display: flex; flex-direction: column; text-align: left; border-top: 1px solid var(--line); opacity: 0; transition: opacity .6s 1.3s; }
  .ok.go .sum { opacity: 1; }
  .sum div { display: flex; gap: 1em; justify-content: space-between; padding: .4em 0; border-bottom: 1px solid var(--line); font-size: .8em; }
  .sum b { flex: none; font-weight: 400; color: var(--fg-soft); }
  .sum span { min-width: 0; text-align: right; overflow-wrap: anywhere; }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script src="../_shared/core.js"></script>
<script src="../_shared/player.js"></script>
<script src="config.js"></script>
<script src="page.js"></script>
</body>
</html>
