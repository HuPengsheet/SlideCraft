<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>清单进度</title>
<link rel="stylesheet" href="../_shared/themes.css">
<link rel="stylesheet" href="../_shared/base.css">
<style>
  .stage {
    --sh: 0 .08em .16em color-mix(in srgb, var(--fg) 6%, transparent), 0 1.3em 2.2em -1.1em color-mix(in srgb, var(--fg-soft) 45%, transparent);
    display: grid; grid-template-columns: 18em minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); gap: 3.4em; align-items: center; padding: 3em 4em;
    background:
      radial-gradient(46em 30em at -4% 108%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 70%),
      radial-gradient(40em 28em at 104% -8%, color-mix(in srgb, var(--accent-3) 10%, transparent), transparent 70%),
      var(--bg);
  }
  .side { min-width: 0; }
  .side .sc-title { font-size: 2.2em; margin-top: .3em; overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3; overflow: hidden; }
  .side .sc-sub { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3; overflow: hidden; overflow-wrap: anywhere; }
  .pct { font-family: var(--font-display); font-weight: 800; font-size: 7.4em; line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; margin-top: .35em; white-space: nowrap; color: var(--fg); transition: color .5s; }
  .pct small { font-size: .38em; letter-spacing: 0; color: var(--accent); margin-left: .08em; font-weight: 700; }
  .all .pct { color: var(--accent); }
  .meter { height: .7em; border-radius: 1em; background: var(--line); margin-top: 1.2em; overflow: hidden; box-shadow: inset 0 .05em .15em color-mix(in srgb, var(--fg) 15%, transparent); }
  .meter i { display: block; height: 100%; width: 0; border-radius: 1em; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .5s cubic-bezier(.2,.8,.2,1); }
  .tally { margin-top: .9em; color: var(--fg-soft); font-size: 1em; font-variant-numeric: tabular-nums; }
  .tally b { color: var(--fg); font-weight: 700; }

  .list { position: relative; --n: 14; --cols: 1; --rows: 14; min-width: 0; min-height: 0; max-height: 100%; display: grid; grid-auto-flow: column; grid-template-rows: repeat(var(--rows), auto); grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); column-gap: 2em; align-content: center; }
  .row { --fs: calc(clamp(.4em, calc(2.1em - var(--rows) * .09em), calc(1.35em - (var(--cols) - 1) * .3em)) * var(--k, 1)); font-size: var(--fs); display: flex; align-items: center; gap: .8em; padding: .5em .2em; border-bottom: 1px solid var(--line); min-width: 0; cursor: pointer; opacity: 0; transform: translateX(1.4em); transition: opacity .5s, transform .6s cubic-bezier(.2,.8,.2,1); }
  .row.in { opacity: 1; transform: none; }
  .row.in.done { opacity: .72; }
  .box { flex: none; width: 1.6em; height: 1.6em; position: relative; border-radius: 50%; border: .12em solid var(--line); background: var(--surface); transition: border-color .3s, background .3s, box-shadow .3s; }
  .box::before { content: ""; position: absolute; inset: -.12em; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent-2)); transform: scale(0); transition: transform .4s cubic-bezier(.3,1.5,.5,1); }
  .box svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .box path { fill: none; stroke: var(--bg); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 20; stroke-dashoffset: 20; transition: stroke-dashoffset .45s .15s cubic-bezier(.4,0,.2,1); }
  .done .box { border-color: transparent; box-shadow: 0 .3em .7em -.2em color-mix(in srgb, var(--accent) 60%, transparent); }
  .done .box::before { transform: scale(1); }
  .done .box path { stroke-dashoffset: 0; }
  .txt { min-width: 0; flex: 1; }
  .tx { display: inline; font-size: 1.15em; line-height: 1.3; overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden;
    background: linear-gradient(var(--fg-soft), var(--fg-soft)) no-repeat 0 55% / 0 .08em; transition: background-size .5s .1s cubic-bezier(.4,0,.2,1), color .4s; }
  .done .tx { color: var(--fg-soft); background-size: 100% .08em; }
  .nt { color: var(--fg-soft); font-size: .78em; margin-top: .1em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list.dense .nt { display: none; }
  .list.dense .row { padding: .3em .2em; }
  .list.dense .tx { -webkit-line-clamp: 1; line-clamp: 1; }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script src="../_shared/core.js"></script>
<script src="../_shared/player.js"></script>
<script src="config.js"></script>
<script src="page.js"></script>
</body>
</html>
