<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logo 揭示</title>
<link rel="stylesheet" href="../_shared/themes.css">
<link rel="stylesheet" href="../_shared/base.css">
<style>
  .stage { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .glow { position: absolute; left: 50%; top: 46%; width: 60em; height: 40em; margin: -20em 0 0 -30em; border-radius: 50%; opacity: 0;
    background: radial-gradient(closest-side, var(--accent), transparent); filter: blur(2em); }
  .bgrid { position: absolute; inset: 0; opacity: .5;
    background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 5em 5em; background-position: center;
    -webkit-mask-image: radial-gradient(closest-side at 50% 46%, #000, transparent); mask-image: radial-gradient(closest-side at 50% 46%, #000, transparent); }
  .mark { position: relative; z-index: 1; width: 62em; height: 24em; display: flex; align-items: center; justify-content: center; }
  .mark svg { width: 100%; height: 100%; overflow: visible; }
  .hair { position: absolute; z-index: 1; top: 50%; height: 1px; width: 0; background: var(--line); }
  .tag { position: relative; z-index: 1; margin-top: 2.2em; display: flex; align-items: center; gap: 1.4em; opacity: 0; max-width: 90%; }
  .tag span { font-size: 1.25em; color: var(--fg-soft); letter-spacing: .4em; padding-left: .4em; }
  .tag i { display: block; width: 4em; height: 1px; background: var(--accent); transform: scaleX(0); }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script src="../_shared/core.js"></script>
<script src="../_shared/player.js"></script>
<script src="config.js"></script>
<script src="page.js"></script>
</body>
</html>
