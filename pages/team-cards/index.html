<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>团队介绍</title>
<link rel="stylesheet" href="../_shared/themes.css">
<link rel="stylesheet" href="../_shared/base.css">
<style>
  .stage {
    --sh: 0 .08em .16em color-mix(in srgb, var(--fg) 6%, transparent), 0 1.3em 2.2em -1.1em color-mix(in srgb, var(--fg-soft) 45%, transparent);
    --sh-up: 0 .1em .2em color-mix(in srgb, var(--fg) 8%, transparent), 0 2.2em 3em -1.2em color-mix(in srgb, var(--accent) 45%, transparent);
    display: flex; flex-direction: column; gap: 1.8em; padding: 3em 4.6em 3em;
    background:
      radial-gradient(50em 30em at 92% -10%, color-mix(in srgb, var(--accent-2) 12%, transparent), transparent 70%),
      radial-gradient(46em 30em at -6% 110%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 70%),
      var(--bg);
  }
  .head { flex: none; }
  .head .sc-title { font-size: 2.3em; letter-spacing: -.01em; }
  .cards { flex: 1; min-height: 0; display: flex; gap: 1.1em; padding: .6em 0 .8em; }
  .cards.grid { display: grid; grid-template-columns: repeat(var(--c), minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); }

  .card { position: relative; flex: 1 1 0; min-width: 0; min-height: 0; overflow: hidden; display: flex; flex-direction: column; align-items: flex-start;
    padding: 1.5em 1.4em 1.3em; border-radius: 1.2em; border: 1px solid var(--line); box-shadow: var(--sh); outline: none; cursor: default; text-align: left;
    background: linear-gradient(165deg, color-mix(in srgb, var(--fg) 5%, transparent), transparent 50%), var(--surface);
    opacity: 0; transform: translateY(1.6em) scale(.94);
    transition: flex-grow .55s cubic-bezier(.2,.8,.2,1), transform .55s cubic-bezier(.2,.8,.2,1), opacity .6s, box-shadow .4s, border-color .4s; }
  .card.in { opacity: 1; transform: none; }
  .card.in.live { cursor: pointer; }
  .row .card.act { flex-grow: 1.7; }
  .grid .card.act { transform: scale(1.045); z-index: 2; }
  .card.act { box-shadow: var(--sh-up); border-color: color-mix(in srgb, var(--accent) 70%, var(--line)); }
  .card:focus-visible { border-color: var(--accent-3); }
  .card::before { content: ""; position: absolute; left: 0; top: 0; height: .28em; width: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transform: scaleX(0); transform-origin: left; transition: transform .6s cubic-bezier(.2,.8,.2,1); }
  .card.act::before { transform: none; }

  .av { flex: none; width: 5.4em; height: 5.4em; border-radius: 50%; overflow: hidden; display: grid; place-items: center; margin-bottom: 1em;
    box-shadow: 0 0 0 .25em var(--surface), 0 0 0 .4em var(--line); transition: transform .55s cubic-bezier(.2,.8,.2,1), box-shadow .4s; }
  .grid .av { width: 4.2em; height: 4.2em; margin-bottom: .7em; }
  .card.act .av { transform: scale(1.08); box-shadow: 0 0 0 .25em var(--surface), 0 0 0 .45em var(--accent); }
  .av img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .av .mono { font-family: var(--font-display); font-weight: 700; font-size: 1.9em; letter-spacing: .02em; color: var(--bg); text-shadow: 0 .05em .2em color-mix(in srgb, var(--fg) 25%, transparent); }
  .grid .av .mono { font-size: 1.5em; }

  .nm { font-family: var(--font-display); font-weight: 700; font-size: 1.45em; line-height: 1.15; max-width: 100%; overflow-wrap: anywhere; }
  .grid .nm { font-size: 1.2em; }
  .rl { color: var(--accent); font-size: .85em; margin-top: .3em; max-width: 100%; }
  .bio { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows .55s cubic-bezier(.2,.8,.2,1), opacity .45s; min-height: 0; width: 100%; }
  .bio > p { overflow: hidden; margin: 0; color: var(--fg-soft); font-size: .85em; line-height: 1.55; min-height: 0; transition: margin .55s; }
  .card.act .bio { grid-template-rows: 1fr; opacity: 1; }
  .card.act .bio > p { margin-top: .8em; }
  .grid .bio > p { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3; }
  .tags { margin-top: auto; padding-top: .9em; display: flex; flex-wrap: wrap; gap: .4em; max-height: 4.4em; overflow: hidden; }
  .tags span { font-size: .7em; padding: .25em .75em; border-radius: 2em; border: 1px solid var(--line); color: var(--fg-soft); transition: color .3s, border-color .3s; white-space: nowrap; }
  .card.act .tags span { color: var(--fg); border-color: color-mix(in srgb, var(--accent) 60%, var(--line)); }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script src="../_shared/core.js"></script>
<script src="../_shared/player.js"></script>
<script src="config.js"></script>
<script src="page.js"></script>
</body>
</html>
