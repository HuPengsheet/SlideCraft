<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>终端演示</title>
<link rel="stylesheet" href="../_shared/themes.css">
<link rel="stylesheet" href="../_shared/base.css">
<style>
  .stage { display: flex; align-items: center; justify-content: center; padding: 3.5em 8em; }
  .win { width: 100%; height: 100%; display: flex; flex-direction: column; background: var(--bg); border: 1px solid var(--line); border-radius: .9em; overflow: hidden; box-shadow: 0 1.5em 4em rgba(0,0,0,.45); }
  .bar { flex: none; display: flex; align-items: center; gap: .6em; padding: .7em 1em; background: var(--surface); border-bottom: 1px solid var(--line); }
  .bar i { width: .85em; height: .85em; border-radius: 50%; display: block; }
  .bar i:nth-child(1) { background: #ff5f57; } .bar i:nth-child(2) { background: #febc2e; } .bar i:nth-child(3) { background: #28c840; }
  .bar b { flex: 1; text-align: center; font-weight: 400; font-size: .8em; color: var(--fg-soft); margin-right: 3.5em; font-family: var(--font-mono); }
  .body { flex: 1; overflow: hidden; padding: 1.1em 1.4em; font-family: var(--font-mono); font-size: 1em; line-height: 1.55; white-space: pre-wrap; word-break: break-all; }
  .ln { min-height: 1.55em; }
  .ps { color: var(--good); }
  .dim { color: var(--fg-soft); }
  .cur { display: inline-block; width: .6em; height: 1.1em; vertical-align: text-bottom; background: var(--fg); animation: blink calc(1.1s / var(--speed)) steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script src="../_shared/core.js"></script>
<script src="../_shared/player.js"></script>
<script src="config.js"></script>
<script src="page.js"></script>
</body>
</html>
