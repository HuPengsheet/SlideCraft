<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>项目排期</title>
<link rel="stylesheet" href="../_shared/themes.css">
<link rel="stylesheet" href="../_shared/base.css">
<style>
  .stage { display: flex; flex-direction: column; gap: 1.4em; padding: 3em 4.5em 2.2em; }
  .head .sc-title { font-size: 2.2em; }
  .rise { opacity: 0; animation: rise calc(.7s / var(--speed)) cubic-bezier(.2,.7,.2,1) forwards; animation-delay: calc(var(--d, 0s) / var(--speed)); }
  @keyframes rise { from { opacity: 0; transform: translateY(.7em); } to { opacity: 1; transform: none; } }
  .note { color: var(--fg-soft); font-size: .78em; }

  .card { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 1.2em 1.6em 1em; box-shadow: 0 .8em 2.4em color-mix(in srgb, var(--fg) 10%, transparent); }
  .axis, .row { display: grid; grid-template-columns: 14em minmax(0, 1fr); column-gap: 1.2em; }
  .axis { height: 1.8em; flex: none; }
  .ticks { position: relative; }
  .tick { position: absolute; top: 0; transform: translateX(-.2em); font-family: var(--font-mono); font-size: .72em; color: var(--fg-soft); white-space: nowrap; opacity: 0; animation: fadein calc(.5s / var(--speed)) forwards; animation-delay: calc(var(--i) * .03s / var(--speed)); }
  @keyframes fadein { to { opacity: 1; } }
  .rows { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; border-top: 1px solid var(--line); }
  .ov { position: absolute; top: 0; bottom: 0; left: 15.2em; right: 0; pointer-events: none; }
  .gl { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line); opacity: .7; }
  .past { position: absolute; top: 0; bottom: 0; left: 0; width: 0; background: color-mix(in srgb, var(--accent) 6%, transparent); }
  .today { position: absolute; top: 0; bottom: 0; left: 0; width: 0; border-left: .14em solid var(--bad); opacity: 0; z-index: 3; }
  .today b { position: absolute; top: -1.9em; left: 0; transform: translateX(-50%); background: var(--bad); color: var(--bg); font-size: .7em; letter-spacing: .08em; padding: .15em .6em; border-radius: 1em; white-space: nowrap; }
  .today::after { content: ""; position: absolute; top: -.4em; left: -.4em; width: .66em; height: .66em; border-radius: 50%; background: var(--bad); box-shadow: 0 0 .8em var(--bad); }

  .row { flex: 1 1 0; max-height: 3.6em; align-items: center; position: relative; }
  .row.grp { flex: 0 0 auto; height: 2.2em; max-height: none; align-items: end; padding-bottom: .25em; }
  .grp .gn { grid-column: 1 / -1; display: flex; align-items: center; gap: .6em; font-size: .72em; letter-spacing: .16em; color: var(--c); font-weight: 700; opacity: 0; transition: opacity calc(.5s / var(--speed)); }
  .grp .gn::before { content: ""; width: .7em; height: .7em; border-radius: .2em; background: var(--c); }
  .grp .gn::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--c), transparent); opacity: .5; }
  .grp.on .gn { opacity: 1; }
  .nm { display: flex; justify-content: space-between; align-items: baseline; gap: .6em; min-width: 0; font-size: .92em; padding-left: .9em; opacity: 0; transform: translateX(-.5em); transition: opacity calc(.5s / var(--speed)), transform calc(.5s / var(--speed)); }
  .nm span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nm em { font-style: normal; font-family: var(--font-mono); font-size: .8em; color: var(--fg-soft); }
  .row.on .nm { opacity: 1; transform: none; }
  .tr { position: relative; height: 100%; }
  .bar { position: absolute; top: 50%; height: min(58%, 1.7em); transform: translateY(-50%); border-radius: .45em; background: color-mix(in srgb, var(--c) 28%, var(--surface)); border: 1px solid color-mix(in srgb, var(--c) 55%, transparent); overflow: hidden; clip-path: inset(0 100% 0 0 round .45em); transition: clip-path calc(.7s / var(--speed)) cubic-bezier(.3,.7,.2,1); }
  .row.on .bar { clip-path: inset(0 0 0 0 round .45em); }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--c); border-radius: inherit; box-shadow: .1em 0 .8em color-mix(in srgb, var(--c) 60%, transparent); transition: width calc(.9s / var(--speed)) cubic-bezier(.3,.7,.2,1) calc(.45s / var(--speed)); }
  .row.on .bar i { width: var(--p); }
  .row:hover .bar { filter: brightness(1.12); }
  .row.ms .bar { display: none; }
  .dia { position: absolute; top: 50%; width: 1.05em; height: 1.05em; margin: -.525em 0 0 -.525em; background: var(--c); border: .13em solid var(--bg); outline: 1px solid var(--c); transform: rotate(45deg) scale(0); transition: transform calc(.5s / var(--speed)) cubic-bezier(.2,1.7,.4,1); box-shadow: 0 0 .9em var(--c); display: none; }
  .row.ms .dia { display: block; }
  .row.ms.on .dia { transform: rotate(45deg) scale(1); }
  .nomo .tick { animation: none; opacity: 1; }
  .nomo .rise { animation: none; opacity: 1; }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script src="../_shared/core.js"></script>
<script src="../_shared/player.js"></script>
<script src="config.js"></script>
<script src="page.js"></script>
</body>
</html>
