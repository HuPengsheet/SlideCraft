<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数字对比</title>
<link rel="stylesheet" href="../_shared/themes.css">
<link rel="stylesheet" href="../_shared/base.css">
<style>
  .stage {
    --sh: 0 .08em .16em color-mix(in srgb, var(--fg) 6%, transparent), 0 1.6em 2.6em -1.2em color-mix(in srgb, var(--accent) 45%, transparent);
    display: flex; flex-direction: column; justify-content: space-between; gap: 1.5em; padding: 3.2em 5.5em 3.4em;
    background:
      radial-gradient(44em 30em at 100% 110%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 70%),
      radial-gradient(40em 28em at -4% -10%, color-mix(in srgb, var(--accent-3) 11%, transparent), transparent 70%),
      var(--bg);
  }
  .head { flex: none; }
  .head .sc-title { font-size: 2.2em; margin-top: .3em; overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; }
  .head .sc-sub { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; overflow-wrap: anywhere; }
  .duel { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 5em minmax(0, 1fr); align-items: center; gap: 1em; }
  .blk { min-width: 0; opacity: 0; transition: opacity .8s, transform 1s cubic-bezier(.2,.8,.2,1); }
  .blk.l { transform: translateX(-3em); text-align: right; }
  .blk.r { transform: translateX(3em); text-align: left; }
  .in .blk { opacity: 1; transform: none; }
  .blk.l { color: var(--fg-soft); }
  .lab { font-size: 1.1em; color: var(--fg-soft); margin-bottom: .5em; overflow-wrap: anywhere; }
  .val { font-family: var(--font-display); font-weight: 800; font-size: calc(8em * var(--k, 1)); line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .blk.r .val { color: var(--fg); }
  .blk.l .val { color: color-mix(in srgb, var(--fg) 62%, var(--bg)); }
  .val small { font-size: .3em; letter-spacing: 0; font-weight: 600; color: var(--accent); margin-left: .2em; }
  .val .pre { font-size: .6em; letter-spacing: 0; margin-right: .08em; }
  .vs { display: grid; place-items: center; }
  .vs span { width: 4.2em; height: 4.2em; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 1.3em; letter-spacing: .04em;
    background: var(--surface); border: 1px solid var(--line); color: var(--accent); box-shadow: var(--sh); transform: scale(0) rotate(-40deg); transition: transform .8s .35s cubic-bezier(.3,1.6,.5,1); }
  .in .vs span { transform: none; }

  .foot { flex: none; display: flex; flex-direction: column; gap: .8em; }
  .delta { align-self: center; display: inline-flex; align-items: center; gap: .6em; padding: .55em 1.4em .55em 1em; border-radius: 3em; border: 1px solid var(--c); background: color-mix(in srgb, var(--c) 12%, var(--surface)); color: var(--c); box-shadow: var(--sh);
    opacity: 0; transform: translateY(1em); transition: opacity .6s .9s, transform .8s .9s cubic-bezier(.2,.8,.2,1); }
  .delta.good { --c: var(--good); } .delta.bad { --c: var(--bad); } .delta.flat { --c: var(--fg-soft); }
  .in .delta { opacity: 1; transform: none; }
  .delta svg { width: 1.6em; height: 1.6em; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .delta b { font-family: var(--font-display); font-size: 2.2em; line-height: 1; font-weight: 800; font-variant-numeric: tabular-nums; }
  .delta span { color: var(--fg-soft); font-size: .95em; }
  .delta span:empty { display: none; }
  .cmp { display: flex; height: 1.1em; border-radius: 1em; overflow: hidden; background: var(--line); gap: .2em; opacity: 0; transition: opacity .6s .6s; }
  .in .cmp { opacity: 1; }
  .seg { height: 100%; transition: width 1.6s cubic-bezier(.2,.8,.2,1); min-width: 0; }
  .seg.a { width: var(--s); background: var(--accent-3); border-radius: 1em 0 0 1em; }
  .seg.b { width: calc(100% - var(--s)); background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: 0 1em 1em 0; }
  .cap { display: flex; justify-content: space-between; gap: 2em; color: var(--fg-soft); font-size: .9em; }
  .cap span { min-width: 0; overflow-wrap: anywhere; }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script src="../_shared/core.js"></script>
<script src="../_shared/player.js"></script>
<script src="config.js"></script>
<script src="page.js"></script>
</body>
</html>
