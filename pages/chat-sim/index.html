<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Code 模拟</title>
<style>
  :root {
    --bg: #300a24; --fg: #eee8e0; --dim: #a39a98; --accent: #d77757; --ok: #5fb760; --err: #e06c75;
    --add-bg: #1f4a2a; --del-bg: #5a2330; --code: #e6b673; --line: #8a7a80;
    --mono: "Ubuntu Mono", "DejaVu Sans Mono", "Noto Sans Mono CJK SC", "Noto Sans CJK SC", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #1b0715; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }

  /* 窗口保持 16:9，字号随宽度缩放，约 100 列 */
  .term { --u: calc(min(96vw, 96vh * 16 / 9) / 100); width: calc(var(--u) * 100); aspect-ratio: 16 / 9; background: var(--bg); color: var(--fg);
    font-family: var(--mono); font-size: calc(var(--u) * 1.3); line-height: 1.45; border-radius: .6em; overflow: hidden;
    box-shadow: 0 2em 5em rgba(0,0,0,.55); display: flex; flex-direction: column; }
  .tbar { flex: none; height: 2.2em; background: #3b1a31; display: flex; align-items: center; justify-content: center; position: relative; font-size: .8em; color: #c9bcc4; }
  .tbar i { position: absolute; left: 1em; width: .8em; height: .8em; border-radius: 50%; background: #e95420; }
  .screen { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: .6em 1em .4em; }
  .log { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; gap: .55em; }
  .log > * { flex: none; }

  /* 欢迎框 */
  .welcome { position: relative; border: 1px solid var(--accent); border-radius: .3em; margin-top: .8em; display: grid; grid-template-columns: 34% 1fr; padding: .5em 0; }
  .welcome .wt { position: absolute; top: -.8em; left: 1.2em; background: var(--bg); color: var(--accent); padding: 0 .5em; }
  .wl { text-align: center; padding: .2em 1em; border-right: 1px solid var(--accent); display: flex; flex-direction: column; align-items: center; gap: .5em; }
  .wl b { color: #fff; }
  .wl .sub { color: var(--dim); line-height: 1.3; }
  .wr { padding: .2em 1.2em; }
  .wr h4 { margin: 0; color: var(--accent); font-weight: 700; font-size: 1em; }
  .wr hr { border: 0; border-top: 1px solid var(--accent); margin: .5em 0; }
  .mascot { width: 6em; height: auto; image-rendering: crisp-edges; }
  .mascot .b { fill: var(--accent); } .mascot .e { fill: var(--bg); }
  .notice { color: var(--dim); padding: .3em 0 .2em .4em; }
  .notice::before { content: "↑ "; }

  /* 对话 */
  .user { background: #4a2540; padding: .1em .6em; white-space: pre-wrap; }
  .user::before { content: "❯ "; color: var(--dim); }
  .msg { display: grid; grid-template-columns: 1.6em 1fr; }
  .msg .dot { color: var(--fg); }
  .msg.tool .dot { color: var(--ok); }
  .msg.run .dot { animation: blink 1s steps(1) infinite; }
  .msg .c { white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; }
  .msg .c b { color: #fff; }
  code { color: var(--code); }
  .res { display: grid; grid-template-columns: 1.6em 1.6em 1fr; color: var(--dim); margin-top: -.3em; }
  .res .el { grid-column: 2; }
  .res.cont .el { visibility: hidden; }
  .res div { overflow-wrap: anywhere; white-space: pre-wrap; }
  pre.code { margin: 0 0 0 3.2em; padding: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; color: var(--fg); }
  pre.code .ln { display: block; padding: 0 .4em; }
  pre.code .add { background: var(--add-bg); }
  pre.code .del { background: var(--del-bg); }
  .done { color: var(--dim); padding-left: .2em; }
  .spin { flex: none; min-height: 1.45em; margin: .3em 0 .2em .2em; color: var(--accent); white-space: pre; }

  /* 输入框与状态栏 */
  .ibox { flex: none; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: .15em .3em; display: flex; align-items: center; min-height: 1.9em; }
  .ibox .p { font-weight: 700; color: #fff; margin-right: .6em; }
  #txt { white-space: pre; }
  .cur { display: inline-block; width: .6em; height: 1.15em; background: var(--fg); animation: blink 1s steps(1) infinite; }
  .status { flex: none; display: flex; justify-content: space-between; color: var(--dim); padding: .25em .6em 0; }
  .status #eff::before { content: "◐ "; }

  .ctl { position: fixed; right: 12px; bottom: 10px; display: flex; gap: 6px; font-size: 12px; opacity: .55; transition: opacity .2s; }
  .ctl:hover { opacity: 1; }
  .ctl button { background: #3b1a31; color: #d9ccd3; border: 1px solid #5a3350; border-radius: 5px; padding: 4px 10px; cursor: pointer; font: inherit; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
<div class="term" id="term">
  <div class="tbar"><i></i><span id="wtitle"></span></div>
  <div class="screen">
    <div class="log" id="log"></div>
    <div class="spin" id="spin"></div>
    <div class="ibox"><span class="p">❯</span><span id="txt"></span><span class="cur"></span></div>
    <div class="status"><span>? for shortcuts</span><span id="eff"></span></div>
  </div>
</div>
<div class="ctl"><button id="bPause">暂停</button><button id="bReplay">重播</button><button id="bSpeed">1×</button></div>
<script src="conversation.js"></script>
<script src="engine.js"></script>
</body>
</html>
