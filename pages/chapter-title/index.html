<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>章节转场页</title>
<link rel="stylesheet" href="../_shared/themes.css">
<link rel="stylesheet" href="../_shared/base.css">
<style>
  .stage { display: flex; align-items: center; padding: 0 7em; }
  .bg { position: absolute; inset: 0; overflow: hidden; opacity: 0; }
  .blk { position: absolute; border-radius: 1.2em; animation: drift calc(18s / var(--speed)) ease-in-out infinite alternate; }
  .blk:nth-child(1) { width: 46em; height: 30em; left: -10em; top: -8em; background: var(--accent); opacity: .22; }
  .blk:nth-child(2) { width: 34em; height: 34em; right: -6em; top: 4em; background: var(--accent-2); opacity: .18; border-radius: 50%; animation-duration: calc(24s / var(--speed)); animation-delay: -6s; }
  .blk:nth-child(3) { width: 40em; height: 16em; left: 30%; bottom: -5em; background: var(--accent-3); opacity: .2; animation-duration: calc(21s / var(--speed)); animation-delay: -11s; }
  @keyframes drift { from { transform: translate(0, 0) rotate(-2deg); } to { transform: translate(5em, 3em) rotate(3deg); } }
  .ln { position: absolute; left: -10%; width: 120%; height: 1px; background: var(--line); transform: rotate(-12deg); animation: slide calc(14s / var(--speed)) linear infinite alternate; }
  .ln:nth-child(3n) { background: var(--accent); opacity: .5; }
  .ln:nth-child(3n+1) { background: var(--accent-2); opacity: .4; }
  @keyframes slide { from { margin-left: -4em; } to { margin-left: 4em; } }
  .gr { position: absolute; inset: -6em; background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 6em 6em; animation: pan calc(20s / var(--speed)) linear infinite; }
  @keyframes pan { to { background-position: 6em 6em; } }
  .shade { position: absolute; inset: 0; background: linear-gradient(90deg, var(--bg) 8%, transparent 70%); }

  .num { position: relative; display: flex; height: 1em; font-size: 22em; line-height: 1; font-family: var(--font-display); font-weight: 800; font-variant-numeric: tabular-nums; margin-right: .12em; letter-spacing: -.04em; flex: none; }
  .col { display: block; height: 1em; overflow: hidden; width: .62em; text-align: center; }
  .col > b { display: block; font-weight: inherit; }
  .col > b > i { display: block; height: 1em; font-style: normal; color: var(--accent); text-shadow: 0 .04em .12em var(--line); }
  .txt { position: relative; border-left: .15em solid var(--accent); padding-left: 2.6em; min-width: 0; flex: 1; }
  .txt .sc-eyebrow { display: block; margin-bottom: 1em; }
  .ttl { font-family: var(--font-display); font-weight: 800; font-size: 4.4em; line-height: 1.1; margin: 0; letter-spacing: -.01em; overflow-wrap: anywhere; }
  .sub { margin: .8em 0 0; font-size: 1.4em; color: var(--fg-soft); overflow-wrap: anywhere; }
  .txt > * { opacity: 0; transform: translateY(.8em); }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script src="../_shared/core.js"></script>
<script src="../_shared/player.js"></script>
<script src="config.js"></script>
<script src="page.js"></script>
</body>
</html>
