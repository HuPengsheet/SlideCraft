<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D 标签球</title>
<link rel="stylesheet" href="../_shared/themes.css">
<link rel="stylesheet" href="../_shared/base.css">
<style>
  .stage {
    background:
      radial-gradient(46em 32em at 62% 56%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 70%),
      radial-gradient(40em 28em at 0% 0%, color-mix(in srgb, var(--accent-3) 10%, transparent), transparent 70%),
      var(--bg);
  }
  .sphere { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .hud { position: absolute; left: 5em; top: 3.4em; width: 22em; pointer-events: none; opacity: 0; transform: translateY(1em); transition: opacity .9s, transform 1s cubic-bezier(.2,.8,.2,1); }
  .hud.in { opacity: 1; transform: none; }
  .hud .sc-title { font-size: 2.4em; margin-top: .3em; overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3; overflow: hidden; }
  .hud .sc-sub { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3; overflow: hidden; overflow-wrap: anywhere; }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script src="../_shared/core.js"></script>
<script src="../_shared/player.js"></script>
<script src="config.js"></script>
<script src="page.js"></script>
</body>
</html>
