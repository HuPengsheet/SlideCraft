<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>翻转卡片</title>
<link rel="stylesheet" href="../_shared/themes.css">
<link rel="stylesheet" href="../_shared/base.css">
<style>
  .stage { background: radial-gradient(ellipse at 50% 60%, var(--surface) 0%, var(--bg) 75%); user-select: none; -webkit-user-select: none; }
  .root { position: absolute; inset: 0; }
  .head { position: absolute; left: 0; right: 0; top: 2.125em; text-align: center; opacity: 0; translate: 0 0.625em; transition: opacity calc(.8s / var(--speed)), translate calc(.8s / var(--speed)) cubic-bezier(.2,.7,.2,1); }
  .head.in { opacity: 1; translate: 0 0; }
  .head .sc-title { font-size: 2.4em; font-weight: 800; margin-top: 0.156em; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 2.5em; }
  .head .sc-sub { margin-top: 0.375em; padding: 0 5em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hint { position: absolute; left: 0; right: 0; bottom: 1.125em; text-align: center; font-size: .72em; color: var(--fg-soft); letter-spacing: .08em; }
  .grid { position: absolute; left: 0; right: 0; display: flex; flex-wrap: wrap; justify-content: center; align-content: center; perspective: 56.25em; }

  .card { --c: var(--accent); position: relative; margin: 0; padding: 0; border: 0; background: none; color: inherit; font: inherit; cursor: pointer; outline: none;
    opacity: 0; translate: 0 1.5em; transition: opacity calc(.6s / var(--speed)) calc(var(--i) * .08s / var(--speed)), translate calc(.8s / var(--speed)) cubic-bezier(.2,.8,.2,1) calc(var(--i) * .08s / var(--speed)); }
  .card.in { opacity: 1; translate: 0 0; }
  .card:focus-visible .inner { outline: 0.094em solid var(--accent); outline-offset: 0.156em; border-radius: 0.562em; }
  .inner { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform calc(.8s / var(--speed)) cubic-bezier(.3,.7,.2,1); }
  .card.flip .inner { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; border-radius: 0.562em; backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden; text-align: left;
    background: var(--surface); border: 1px solid var(--line); box-shadow: 0 0.75em 1.375em -0.75em rgba(0,0,0,.6); }
  .front { display: flex; flex-direction: column; justify-content: flex-end; padding: 0.875em; }
  .front::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 0.188em; background: var(--c); }
  .front .ico { position: absolute; left: 0.875em; top: 0.938em; width: 1.875em; height: 1.875em; color: var(--c); }
  .front .ico svg { width: 100%; height: 100%; display: block; }
  .front .num { position: absolute; left: 0.75em; top: 0.562em; font-family: var(--font-display); font-weight: 800; font-size: 3em; line-height: 1; color: var(--c); }
  .front .pic { position: absolute; inset: 0 0 38% 0; }
  .front .pic img, .front .pic video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .front .pic .miss { width: 100%; height: 100%; background: linear-gradient(135deg, color-mix(in srgb, var(--c) 30%, var(--surface)), var(--surface)); }
  .front .kick { font-size: .62em; letter-spacing: .16em; text-transform: uppercase; color: var(--c); font-family: var(--font-mono); position: relative; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .front h3 { margin: 0.156em 0 0; font-family: var(--font-display); font-size: 1.45em; font-weight: 700; line-height: 1.2; position: relative; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .front .tip { position: absolute; right: 0.688em; top: 0.688em; font-size: .6em; color: var(--fg-soft); font-family: var(--font-mono); letter-spacing: .1em; }
  .back { transform: rotateY(180deg); padding: 0.812em 0.875em; display: flex; flex-direction: column; gap: 0.375em;
    background: color-mix(in srgb, var(--c) 14%, var(--surface)); border-color: color-mix(in srgb, var(--c) 45%, var(--line)); }
  .back h4 { margin: 0; flex: none; font-family: var(--font-display); font-size: 1.05em; font-weight: 700; color: var(--c); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .back .txt { flex: 1; min-height: 0; overflow: hidden; font-size: var(--bf, .9em); line-height: 1.55; color: var(--fg); overflow-wrap: anywhere; }
  .empty { position: absolute; left: 50%; top: 50%; translate: -50% -50%; padding: 1.25em 1.875em; border: 0.075em dashed var(--line); border-radius: 0.562em; color: var(--fg-soft); }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script src="../_shared/core.js"></script>
<script src="../_shared/player.js"></script>
<script src="config.js"></script>
<script src="page.js"></script>
</body>
</html>
