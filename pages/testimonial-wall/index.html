<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>评价墙</title>
<link rel="stylesheet" href="../_shared/themes.css">
<link rel="stylesheet" href="../_shared/base.css">
<style>
  .stage {
    --sh: 0 .08em .16em color-mix(in srgb, var(--fg) 6%, transparent), 0 1.2em 2em -1em color-mix(in srgb, var(--fg-soft) 45%, transparent);
    display: flex; align-items: stretch; gap: 4em; padding: 0 5em;
    background:
      radial-gradient(44em 30em at 0% 100%, color-mix(in srgb, var(--accent) 13%, transparent), transparent 70%),
      radial-gradient(40em 28em at 100% 0%, color-mix(in srgb, var(--accent-2) 11%, transparent), transparent 70%),
      var(--bg);
  }
  .side { flex: none; width: 21em; display: flex; flex-direction: column; justify-content: center; opacity: 0; transform: translateX(-1.5em); transition: opacity .8s, transform .9s cubic-bezier(.2,.8,.2,1); }
  .side .sc-title { font-size: 2.8em; margin-top: .3em; overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3; overflow: hidden; }
  .side .sc-sub { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3; overflow: hidden; overflow-wrap: anywhere; }
  .side .avg { margin-top: 1.6em; display: flex; align-items: baseline; gap: .5em; }
  .avg b { font-family: var(--font-display); font-size: 3.6em; line-height: 1; font-weight: 800; }
  .avg span { color: var(--fg-soft); font-size: .9em; }
  .stars { display: inline-flex; gap: .14em; }
  .stars svg { width: 1em; height: 1em; fill: var(--line); }
  .stars svg.on { fill: var(--accent); }
  .side .stars { font-size: 1.3em; margin-top: .5em; }
  .in .side, .side.in { opacity: 1; transform: none; }

  .cols { flex: 1; min-width: 0; display: flex; gap: 1.4em; overflow: hidden; opacity: 0; transition: opacity 1s .2s;
    -webkit-mask-image: linear-gradient(180deg, transparent, #000 14%, #000 86%, transparent); mask-image: linear-gradient(180deg, transparent, #000 14%, #000 86%, transparent); }
  .cols.in { opacity: 1; }
  .col { flex: 1 1 0; min-width: 0; height: 100%; overflow: hidden; }
  .track { will-change: transform; }
  .card { margin-bottom: 1.4em; padding: 1.3em 1.4em 1.2em; border-radius: 1em; border: 1px solid var(--line); box-shadow: var(--sh);
    background: linear-gradient(165deg, color-mix(in srgb, var(--fg) 5%, transparent), transparent 55%), var(--surface); }
  .card .stars { font-size: .95em; }
  .card p { margin: .7em 0 1.1em; font-size: .95em; line-height: 1.6; overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 7; line-clamp: 7; overflow: hidden; }
  .card p b { color: var(--accent); font-weight: 700; }
  .who { display: flex; align-items: center; gap: .75em; min-width: 0; }
  .av { flex: none; width: 2.6em; height: 2.6em; border-radius: 50%; overflow: hidden; display: grid; place-items: center; box-shadow: 0 0 0 .15em var(--surface), 0 0 0 .25em var(--line); }
  .av img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .av .mono { font-family: var(--font-display); font-weight: 700; font-size: 1em; color: var(--bg); }
  .meta { min-width: 0; }
  .nm { font-family: var(--font-display); font-weight: 700; font-size: 1em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rl { color: var(--fg-soft); font-size: .78em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .empty { margin: auto; color: var(--fg-soft); }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script src="../_shared/core.js"></script>
<script src="../_shared/player.js"></script>
<script src="config.js"></script>
<script src="page.js"></script>
</body>
</html>
