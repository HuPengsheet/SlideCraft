<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字符雨</title>
<link rel="stylesheet" href="../_shared/themes.css">
<link rel="stylesheet" href="../_shared/base.css">
<style>
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .vig { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(90% 90% at 50% 50%, transparent 55%, color-mix(in srgb, var(--bg) 85%, transparent)); }
  .tt { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; pointer-events: none; padding: 0 4em; }
  .tt .ttl { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 4.2em; line-height: 1.1; letter-spacing: .04em; max-width: 100%; overflow-wrap: anywhere; color: var(--fg);
    text-shadow: 0 0 .5em color-mix(in srgb, var(--bg) 90%, transparent), 0 0 1.4em color-mix(in srgb, var(--accent) 45%, transparent); }
  .tt .ch { display: inline-block; white-space: pre; }
  .tt .ch.lock { color: var(--fg); }
  .tt .ch.scr { color: var(--accent); }
  .tt .sc-sub { margin-top: 1em; font-family: var(--font-mono); letter-spacing: .12em; opacity: 0; transition: opacity 1s; overflow-wrap: anywhere; }
  .tt .sc-sub.on { opacity: 1; }
  .tt .sc-eyebrow { margin-bottom: 1em; }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script src="../_shared/core.js"></script>
<script src="../_shared/player.js"></script>
<script src="config.js"></script>
<script src="page.js"></script>
</body>
</html>
