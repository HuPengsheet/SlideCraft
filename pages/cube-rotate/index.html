<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>立方体翻面</title>
<link rel="stylesheet" href="../_shared/themes.css">
<link rel="stylesheet" href="../_shared/base.css">
<style>
  .stage { background: var(--bg); }
  .glow { position: absolute; left: 50%; top: 46%; width: 60em; height: 40em; transform: translate(-50%, -50%); pointer-events: none;
    background: radial-gradient(ellipse at center, var(--accent) 0%, transparent 65%); opacity: .13; }
  .scene { position: absolute; inset: 0; perspective: 90em; perspective-origin: 50% 42%; cursor: grab; touch-action: none; }
  .scene.drag { cursor: grabbing; }
  .rig { position: absolute; left: 50%; top: 46%; width: 0; height: 0; transform-style: preserve-3d; }
  .cube { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-style: preserve-3d; will-change: transform; }
  .face { position: absolute; overflow: hidden; background: var(--surface); border: 1px solid var(--line); border-radius: .5em;
    backface-visibility: hidden; display: flex; flex-direction: column; justify-content: flex-end; }
  .face img, .face video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; user-select: none; }
  .face .cap { position: relative; padding: 5em 1.6em 1.4em; background: linear-gradient(to top, var(--bg), transparent); }
  .face.txt { justify-content: center; padding: 2.2em; }
  .face.txt .cap { padding: 0; background: none; }
  .face .no { font-family: var(--font-mono); font-size: .8em; letter-spacing: .2em; color: var(--accent); }
  .face h2 { font-family: var(--font-display); font-weight: 800; font-size: 2em; line-height: 1.12; margin: .35em 0 0; color: var(--fg); }
  .face.txt h2 { font-size: 2.4em; }
  .face p { margin: .6em 0 0; font-size: .95em; color: var(--fg-soft); }
  .face .sh { position: absolute; inset: 0; background: var(--bg); pointer-events: none; opacity: 0; }
  .face .hl { position: absolute; inset: 0; background: linear-gradient(135deg, var(--fg), transparent 55%); pointer-events: none; opacity: 0; mix-blend-mode: soft-light; }
  .floor { position: absolute; left: 50%; width: 30em; height: 4.4em; margin-left: -15em; pointer-events: none;
    background: radial-gradient(ellipse at center, var(--fg) 0%, transparent 70%); opacity: .22; filter: blur(.6em); }
  .head { position: absolute; left: 4em; top: 3.4em; pointer-events: none; max-width: 24em; }
  .head h1 { font-family: var(--font-display); font-weight: 800; font-size: 2.6em; line-height: 1.1; margin: .35em 0 0; text-wrap: balance; }
  .count { position: absolute; right: 4em; bottom: 3.4em; font-family: var(--font-mono); font-size: 1em; color: var(--fg-soft); letter-spacing: .12em; pointer-events: none; }
  .count b { color: var(--fg); font-size: 2.2em; font-weight: 700; vertical-align: -.1em; margin-right: .15em; }
  .hint { position: absolute; left: 4em; bottom: 3.4em; font-size: .75em; letter-spacing: .18em; color: var(--fg-soft); pointer-events: none; opacity: 0; transition: opacity 1s ease; }
  .hint.on { opacity: .8; }
  .fadein { opacity: 0; transition: opacity calc(1s / var(--speed)) ease; }
  .fadein.on { opacity: 1; }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script src="../_shared/core.js"></script>
<script src="../_shared/player.js"></script>
<script src="config.js"></script>
<script src="page.js"></script>
</body>
</html>
