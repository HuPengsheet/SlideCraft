<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>泳道流程图</title>
<link rel="stylesheet" href="../_shared/themes.css">
<link rel="stylesheet" href="../_shared/base.css">
<style>
  .head { position: absolute; left: 4em; top: 2.3em; z-index: 3; }
  .head .sc-title { font-size: 2em; }
  .world { position: absolute; transform-origin: 0 0; }
  .band { position: absolute; left: 0; right: 0; border-radius: .8em; border: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 60%, transparent);
    opacity: 0; transition: opacity calc(.6s / var(--speed)) calc(var(--dl, 0ms) / var(--speed)); }
  .band:nth-child(even) { background: color-mix(in srgb, var(--surface) 30%, transparent); }
  .band.on { opacity: 1; }
  .ln { position: absolute; left: 0; display: flex; align-items: center; gap: .6em; padding-left: 1em; padding-right: .5em; font-family: var(--font-display); font-weight: 700; font-size: .95em; min-width: 0;
    opacity: 0; transition: opacity calc(.5s / var(--speed)) calc(var(--dl, 0ms) / var(--speed)); }
  .ln.on { opacity: 1; }
  .ln i { flex: none; width: .35em; height: 1.4em; border-radius: .2em; background: var(--c); }
  .ln span { min-width: 0; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
  svg.lk { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; z-index: 1; }
  .e { fill: none; stroke: var(--line); stroke-width: .16; stroke-linejoin: round; stroke-linecap: round; transition: opacity .3s, stroke .3s; }
  .e.lit { stroke: var(--fg-soft); }
  .ar { fill: var(--fg-soft); opacity: 0; transition: opacity .3s; }
  .ar.lit { opacity: 1; }
  .dot { fill: var(--accent); filter: drop-shadow(0 0 .45em var(--accent)); }
  .el { position: absolute; transform: translate(-50%, -50%); font-size: .68em; color: var(--fg-soft); background: var(--bg); border: 1px solid var(--line); border-radius: 1em; padding: .05em .6em; white-space: nowrap; max-width: 9em; overflow: hidden; text-overflow: ellipsis; z-index: 2; opacity: 0; transition: opacity .4s; }
  .el.lit { opacity: 1; }
  .n { position: absolute; z-index: 2; display: flex; align-items: center; justify-content: center; text-align: center; padding: .3em .7em; font-size: .85em; font-weight: 600;
    background: var(--surface); border: 1px solid var(--line); border-radius: .6em; color: var(--fg-soft);
    opacity: .35; transition: opacity calc(.5s / var(--speed)), transform calc(.5s / var(--speed)) cubic-bezier(.2,1.5,.4,1), border-color .4s, color .4s, box-shadow .4s; }
  .n span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; min-width: 0; }
  .n.on { opacity: 1; color: var(--fg); border-color: var(--c); background: color-mix(in srgb, var(--c) 14%, var(--surface)); box-shadow: 0 .4em 1.2em color-mix(in srgb, var(--c) 28%, transparent); animation: pop calc(.55s / var(--speed)) cubic-bezier(.2,1.5,.4,1); }
  @keyframes pop { from { transform: scale(.85); } to { transform: none; } }
  .n.start, .n.end { border-radius: 2em; }
  .n.start.on, .n.end.on { background: var(--c); color: var(--bg); }
  .n.decision { border-style: dashed; }
  .world.focus .n.on:not(.hl) { opacity: .35; }
  .world.focus .e:not(.hl) { opacity: .15; }
  .world.focus .e.hl { stroke: var(--accent); }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script src="../_shared/core.js"></script>
<script src="../_shared/player.js"></script>
<script src="config.js"></script>
<script src="page.js"></script>
</body>
</html>
