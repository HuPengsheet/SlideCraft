<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>倒计时</title>
<link rel="stylesheet" href="../_shared/themes.css">
<link rel="stylesheet" href="../_shared/base.css">
<style>
  .stage { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 3.2em; }
  .head .sc-title { font-size: 3.2em; }
  .units { display: flex; gap: 2.6em; align-items: flex-start; }
  .unit { display: flex; flex-direction: column; align-items: center; gap: .9em; }
  .digits { display: flex; gap: .35em; font-family: var(--font-display); font-weight: 700; font-size: 6.4em; font-variant-numeric: tabular-nums; }
  .lab { font-size: 1.1em; color: var(--fg-soft); letter-spacing: .3em; text-indent: .3em; }

  /* plain */
  .plain .dg { min-width: .62em; line-height: 1.1; text-align: center; }
  .plain .digits { padding: .1em .22em; background: var(--surface); border: 1px solid var(--line); border-radius: .14em; gap: 0; font-size: 5.6em; }
  .plain .digits .dg { width: .62em; }

  /* flip */
  .flip .dg { position: relative; width: .74em; height: 1.1em; line-height: 1.1em; perspective: 4em; }
  .flip .dg > i { position: absolute; left: 0; right: 0; height: 50%; overflow: hidden; font-style: normal; background: var(--surface); border: 1px solid var(--line); backface-visibility: hidden; }
  .flip .dg > i > b { display: block; font-weight: inherit; height: 1.1em; text-align: center; }
  .flip .dg .up, .flip .dg .fu { top: 0; border-radius: .1em .1em 0 0; border-bottom: 0; }
  .flip .dg .dn, .flip .dg .fd { bottom: 0; border-radius: 0 0 .1em .1em; border-top: 0; background: color-mix(in srgb, var(--surface) 88%, var(--bg)); }
  .flip .dg .dn > b, .flip .dg .fd > b { position: absolute; bottom: 0; left: 0; right: 0; }
  .flip .dg .fu { transform-origin: 50% 100%; z-index: 2; display: none; }
  .flip .dg .fd { transform-origin: 50% 0; z-index: 2; display: none; transform: rotateX(90deg); }
  .flip .dg::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: .02em; margin-top: -.01em; background: var(--bg); z-index: 3; }
  .flip .dg.go .fu { display: block; animation: fu calc(.5s / var(--speed)) ease-in forwards; }
  .flip .dg.go .fd { display: block; animation: fd calc(.5s / var(--speed)) ease-out forwards; }
  @keyframes fu { 0% { transform: rotateX(0); } 50%, 100% { transform: rotateX(-90deg); } }
  @keyframes fd { 0%, 50% { transform: rotateX(90deg); } 100% { transform: rotateX(0); } }

  .unit.tick .digits { color: var(--fg); }
  .urgent .digits { color: var(--bad); }

  /* 结束态 */
  .done-box { display: none; font-family: var(--font-display); font-weight: 800; font-size: 5em; color: var(--accent); }
  .done .units { display: none; }
  .done .done-box { display: block; animation: pop calc(.9s / var(--speed)) cubic-bezier(.2,.9,.3,1.3) backwards; }
  @keyframes pop { from { opacity: 0; transform: scale(.4); } }
  .confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .confetti i { position: absolute; top: -2em; left: calc(var(--x) * 1%); width: .6em; height: 1.1em; background: var(--accent); border-radius: .1em;
    animation: fall calc(var(--d) * 1s / var(--speed)) linear infinite; animation-delay: calc(var(--w) * -1s / var(--speed)); }
  .confetti i:nth-child(3n+1) { background: var(--accent-2); }
  .confetti i:nth-child(3n+2) { background: var(--accent-3); }
  .confetti i:nth-child(5n) { background: var(--good); }
  @keyframes fall { from { transform: translateY(0) rotate(0); } to { transform: translateY(70em) rotate(var(--r)); } }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script src="../_shared/core.js"></script>
<script src="../_shared/player.js"></script>
<script src="config.js"></script>
<script src="page.js"></script>
</body>
</html>
