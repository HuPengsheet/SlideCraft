<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>极光背景</title>
<link rel="stylesheet" href="../_shared/themes.css">
<link rel="stylesheet" href="../_shared/base.css">
<style>
  .stage { background: var(--bg); }
  .au { position: absolute; inset: 0; width: 100%; height: 100%; display: block; opacity: 0; transition: opacity calc(1.6s / var(--speed)) ease; }
  .au.on { opacity: 1; }
  .grain { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: overlay; background-repeat: repeat; background-size: 10em 10em; image-rendering: pixelated; }
  .veil { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 50%, transparent 40%, var(--bg) 135%); opacity: .55; }
  .copy { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 8em; pointer-events: none; }
  .copy > * { opacity: 0; transform: translateY(.8em); transition: opacity calc(1.2s / var(--speed)) ease, transform calc(1.2s / var(--speed)) cubic-bezier(.2,.7,.2,1); }
  .copy.on > * { opacity: 1; transform: none; }
  .copy .sc-eyebrow { color: var(--fg); opacity: 0; letter-spacing: .32em; font-size: .8em; margin-bottom: 1.6em; transition-delay: calc(.3s / var(--speed)); }
  .copy.on .sc-eyebrow { opacity: .75; }
  .copy h1 { font-family: var(--font-display); font-weight: 800; font-size: 5em; line-height: 1.08; margin: 0; letter-spacing: -.02em; text-wrap: balance; max-width: 15em; transition-delay: calc(.5s / var(--speed)); }
  .copy .rule { width: 3.2em; height: .16em; border-radius: 1em; background: var(--fg); margin: 1.8em 0 1.4em; transition-delay: calc(.7s / var(--speed)); }
  .copy.on .rule { opacity: .6; }
  .copy p { margin: 0; color: var(--fg-soft); font-size: 1.15em; max-width: 30em; transition-delay: calc(.9s / var(--speed)); }
  .copy.on p { opacity: .9; }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script src="../_shared/core.js"></script>
<script src="../_shared/player.js"></script>
<script src="config.js"></script>
<script src="page.js"></script>
</body>
</html>
