<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>组织架构树</title>
<link rel="stylesheet" href="../_shared/themes.css">
<link rel="stylesheet" href="../_shared/base.css">
<style>
  .stage { display: flex; flex-direction: column; gap: 1em; padding: 3.2em 4em 2.4em; }
  .rise { opacity: 0; animation: rise calc(.8s / var(--speed)) cubic-bezier(.2,.7,.2,1) forwards; animation-delay: calc(var(--d, 0s) / var(--speed)); }
  @keyframes rise { from { opacity: 0; transform: translateY(.7em); } to { opacity: 1; transform: none; } }
  .nomo .rise { animation: none; opacity: 1; }
  .top { flex: none; }
  .top .sc-title { font-size: 2.3em; }
  .plot { flex: 1; min-height: 0; position: relative; overflow: hidden; }
  .world { position: absolute; left: 0; top: 0; transform-origin: 0 0; transition: transform calc(.55s / var(--speed)) cubic-bezier(.3,.7,.2,1); }
  .nomo .world, .nomo .card, .nomo .edge { transition: none; animation: none; }
  .edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  .edge { fill: none; stroke: var(--line); stroke-width: .14; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw calc(.7s / var(--speed)) ease-out forwards; animation-delay: calc(var(--d, 0) * 1s / var(--speed)); }
  .settled .edge { animation: none; stroke-dashoffset: 0; }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  .card { position: absolute; display: flex; align-items: center; gap: .7em; padding: 0 .8em 0 1em; background: var(--surface); border: 1px solid var(--line); border-left: .28em solid var(--c); border-radius: .6em; box-shadow: 0 .5em 1.2em -.7em var(--fg), 0 .05em 0 var(--line) inset; opacity: 0; transform: scale(.85); transition: left calc(.5s / var(--speed)) cubic-bezier(.3,.7,.2,1), top calc(.5s / var(--speed)) cubic-bezier(.3,.7,.2,1), opacity calc(.4s / var(--speed)), transform calc(.4s / var(--speed)), box-shadow .2s, border-color .2s; overflow: hidden; }
  .card.on { opacity: 1; transform: none; }
  .card.hid { opacity: 0; transform: scale(.6); pointer-events: none; }
  .card.has { cursor: pointer; }
  .card.has:hover { border-color: var(--c); box-shadow: 0 .8em 1.6em -.7em var(--c); }
  .card:focus-visible { outline: .15em solid var(--accent-3); }
  .card.root { background: color-mix(in srgb, var(--c) 14%, var(--surface)); border-color: var(--c); box-shadow: 0 .8em 2em -.9em var(--c); }
  .av { flex: none; width: 2.2em; height: 2.2em; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 22%, var(--surface)); color: var(--c); font-family: var(--font-display); font-weight: 700; font-size: 1em; border: 1px solid color-mix(in srgb, var(--c) 50%, transparent); }
  .tx { min-width: 0; flex: 1; }
  .nm { font-family: var(--font-display); font-weight: 700; font-size: 1em; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rl { color: var(--fg-soft); font-size: .78em; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: .1em; }
  .bd { flex: none; font-family: var(--font-mono); font-size: .72em; padding: .15em .5em; border-radius: 1em; background: var(--c); color: var(--bg); font-weight: 700; }
  .cp .card { gap: 0; padding: 0 .6em 0 .8em; }
  .cp .av { display: none; }
  .cp .nm { font-size: .85em; }
  .cp .rl { font-size: .68em; }
  .note { flex: none; margin: 0; color: var(--fg-soft); font-size: .75em; border-left: .2em solid var(--accent); padding-left: .9em; }
  .empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--fg-soft); }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script src="../_shared/core.js"></script>
<script src="../_shared/player.js"></script>
<script src="config.js"></script>
<script src="page.js"></script>
</body>
</html>
