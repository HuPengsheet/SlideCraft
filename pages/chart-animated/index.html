<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>动画图表</title>
<link rel="stylesheet" href="../_shared/themes.css">
<link rel="stylesheet" href="../_shared/base.css">
<style>
  .stage { display: flex; flex-direction: column; padding: 3.6em 5.5em 3em; gap: 1.2em; }
  .head .sc-title { font-size: 2.2em; }
  .chart { flex: 1; min-height: 0; display: flex; align-items: center; gap: 3em; }
  .chart svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .chart.donut svg { width: auto; aspect-ratio: 1; flex: none; }
  .chart text { font-family: var(--font-body); fill: var(--fg-soft); font-size: 13px; }
  .chart .grid { stroke: var(--line); stroke-width: 1; }
  .chart .axis { stroke: var(--fg-soft); stroke-width: 1; opacity: .5; }
  .chart text.vl { fill: var(--fg); font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; }
  .chart text.cl { fill: var(--fg); font-size: 14px; }
  .chart text.tot { fill: var(--fg); font-family: var(--font-display); font-weight: 700; font-size: 46px; font-variant-numeric: tabular-nums; }
  .chart text.totl { font-size: 14px; }
  .legend { display: flex; gap: 1.6em; flex-wrap: wrap; font-size: .85em; color: var(--fg-soft); justify-content: center; }
  .legend i { display: inline-block; width: .8em; height: .8em; border-radius: .2em; margin-right: .5em; vertical-align: -.05em; }
  .legend.side { flex-direction: column; flex-wrap: nowrap; justify-content: center; gap: .9em; font-size: 1.1em; min-width: 16em; flex: 1; }
  .legend.side .it { display: flex; align-items: center; gap: .3em; color: var(--fg); }
  .legend.side .v { margin-left: auto; padding-left: 1.5em; font-variant-numeric: tabular-nums; color: var(--fg-soft); opacity: 0; }
  .legend.side .v b { color: var(--fg); font-weight: 600; margin-right: .5em; }
  .note { color: var(--fg-soft); font-size: .75em; text-align: right; margin: 0; }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script src="../_shared/core.js"></script>
<script src="../_shared/player.js"></script>
<script src="config.js"></script>
<script src="page.js"></script>
</body>
</html>
