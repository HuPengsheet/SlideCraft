<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>仪表盘</title>
<link rel="stylesheet" href="../_shared/themes.css">
<link rel="stylesheet" href="../_shared/base.css">
<style>
  .stage { display: flex; flex-direction: column; padding: 3.5em 4em; gap: 1.6em; }
  .head .sc-title { font-size: 2.2em; overflow-wrap: anywhere; }
  .head .sc-sub { overflow-wrap: anywhere; }
  .grid { flex: 1; min-height: 0; display: grid; justify-content: center; align-content: center; gap: 1.6em;
    grid-template-columns: repeat(var(--cols, 4), var(--gw, 12em)); }
  .card { width: var(--gw, 12em); padding: .8em .6em 1em; display: flex; flex-direction: column; align-items: center; opacity: 0; transform: translateY(1em) scale(.97);
    transition: opacity .6s, transform .8s cubic-bezier(.2,.7,.2,1); box-shadow: 0 .6em 1.8em color-mix(in srgb, var(--fg) 8%, transparent); }
  .card.on { opacity: 1; transform: none; }
  .card svg { width: 100%; height: auto; display: block; overflow: visible; }
  .track { fill: none; stroke: var(--line); stroke-linecap: round; }
  .band { fill: none; stroke-linecap: butt; opacity: .85; }
  .val { fill: none; stroke-linecap: round; }
  .tick { stroke: var(--fg-soft); stroke-width: 1; opacity: .5; }
  .needle { fill: var(--fg); filter: drop-shadow(0 .15em .2em color-mix(in srgb, var(--fg) 35%, transparent)); }
  .hub { fill: var(--surface); stroke: var(--fg); stroke-width: 2.5; }
  .num { font-family: var(--font-display); font-weight: 700; font-variant-numeric: tabular-nums; text-anchor: middle; }
  .num tspan.u { font-size: .45em; fill: var(--fg-soft); font-weight: 600; }
  .lim { font-family: var(--font-mono); font-size: 8px; fill: var(--fg-soft); text-anchor: middle; }
  .lab { margin-top: .2em; font-size: 1em; text-align: center; max-width: 100%; overflow-wrap: anywhere; line-height: 1.25; }
  .lab small { display: block; color: var(--fg-soft); font-size: .75em; margin-top: .2em; }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script src="../_shared/core.js"></script>
<script src="../_shared/player.js"></script>
<script src="config.js"></script>
<script src="page.js"></script>
</body>
</html>
