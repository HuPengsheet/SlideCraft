<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>接口调试</title>
<link rel="stylesheet" href="../_shared/themes.css">
<link rel="stylesheet" href="../_shared/base.css">
<style>
  :root { --sh: color-mix(in srgb, var(--page-bg) 80%, transparent); }
  .stage { display: flex; flex-direction: column; padding: 2.6em 4em 2.4em;
    background: radial-gradient(ellipse 70% 60% at 50% 105%, color-mix(in srgb, var(--accent) 9%, var(--bg)), var(--bg) 70%); }
  .head { flex: none; opacity: 0; transform: translateY(.8em); transition: opacity .7s, transform .7s cubic-bezier(.2,.8,.2,1); }
  .head.on { opacity: 1; transform: none; }
  .head .sc-title { font-size: 2.2em; }
  .head .sc-sub { font-size: .95em; }
  .panes { position: relative; flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1.8em; margin-top: 1.6em; }
  .pane { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 1em; overflow: hidden;
    box-shadow: 0 1.2em 3em var(--sh); opacity: 0; transform: translateY(2.4em); transition: opacity .7s, transform .8s cubic-bezier(.2,.8,.2,1); }
  .pane.on { opacity: 1; transform: none; }
  .ph { flex: none; display: flex; align-items: center; gap: .6em; padding: .8em 1.2em; border-bottom: 1px solid var(--line); font-size: .7em; letter-spacing: .18em; color: var(--fg-soft); }
  .ph::before { content: ""; width: .6em; height: .6em; border-radius: 50%; background: var(--accent); }
  .pane.res .ph::before { background: var(--accent-3); }

  .urlbar { flex: none; display: flex; align-items: stretch; gap: .7em; margin: 1.1em 1.2em 0; }
  .method { flex: none; align-self: center; font-family: var(--font-mono); font-weight: 700; font-size: .85em; padding: .4em .8em; border-radius: .5em; color: var(--bg); background: var(--accent); letter-spacing: .04em; }
  .method.m-get { background: var(--good); } .method.m-post { background: var(--accent); } .method.m-put { background: var(--accent-3); }
  .method.m-patch { background: var(--accent-2); } .method.m-delete { background: var(--bad); }
  .url { flex: 1; min-width: 0; align-self: center; font-family: var(--font-mono); font-size: .85em; padding: .6em .9em; border: 1px solid var(--line); border-radius: .5em; background: var(--bg); word-break: break-all; min-height: 2.3em; line-height: 1.35; }
  .url::after { content: ""; display: inline-block; width: .5em; height: 1em; margin-left: .1em; vertical-align: text-bottom; background: var(--accent); opacity: 0; }
  .url.typing::after { opacity: 1; animation: blink calc(1s / var(--speed)) steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .send { flex: none; align-self: center; font: inherit; font-size: .85em; font-weight: 700; padding: .6em 1.4em; border-radius: .5em; border: 0; color: var(--bg); background: var(--accent-2); cursor: pointer; position: relative; transition: transform .15s, box-shadow .3s, opacity .3s; }
  .send.hot { box-shadow: 0 0 0 .3em color-mix(in srgb, var(--accent-2) 30%, transparent), 0 0 1.6em color-mix(in srgb, var(--accent-2) 55%, transparent); }
  .send.press { transform: scale(.93); }
  .send:disabled { opacity: .55; cursor: default; }

  .sec { flex: none; padding: 0 1.2em; margin-top: 1.1em; font-size: .7em; letter-spacing: .16em; color: var(--fg-soft); }
  .hdrs { flex: none; max-height: 30%; overflow: auto; scrollbar-width: thin; margin: .5em 1.2em 0; font-family: var(--font-mono); font-size: .8em; display: flex; flex-direction: column; gap: .3em; }
  .hr { display: flex; gap: .6em; opacity: 0; transform: translateX(-.6em); transition: opacity .4s, transform .5s cubic-bezier(.2,.8,.2,1); }
  .hr.on { opacity: 1; transform: none; }
  .hr b { flex: none; font-weight: 400; color: var(--accent-3); }
  .hr span { min-width: 0; word-break: break-all; color: var(--fg-soft); }

  .code { flex: 1; min-height: 0; overflow: auto; scrollbar-width: thin; margin: .5em 1.2em 1.2em; padding: .8em 0; font-family: var(--font-mono); font-size: .82em; line-height: 1.55; counter-reset: ln; border-top: 1px solid var(--line); }
  .cl { display: grid; grid-template-columns: 2.2em minmax(0, 1fr); counter-increment: ln; opacity: 0; transform: translateY(.4em); transition: opacity .35s, transform .45s cubic-bezier(.2,.8,.2,1); }
  .cl.on { opacity: 1; transform: none; }
  .cl::before { content: counter(ln); color: var(--fg-soft); opacity: .5; text-align: right; padding-right: .9em; }
  .cl span { white-space: pre-wrap; word-break: break-all; min-height: 1.55em; }
  .j-k { color: var(--accent-3); } .j-s { color: var(--accent); } .j-n { color: var(--accent-2); } .j-b { color: var(--accent-2); font-weight: 700; } .j-p { color: var(--fg-soft); }

  .stat { flex: none; display: flex; align-items: flex-end; gap: 2em; padding: 1.1em 1.2em 0; opacity: .25; transition: opacity .5s; }
  .stat.on { opacity: 1; }
  .stat .big { font-family: var(--font-display); font-weight: 700; font-size: 3.4em; line-height: 1; font-variant-numeric: tabular-nums; color: var(--good); }
  .stat .big.c3 { color: var(--accent-3); } .stat .big.c4 { color: var(--bad); }
  .stat .lbl { font-size: .7em; letter-spacing: .14em; color: var(--fg-soft); margin-bottom: .3em; }
  .stat .mid { font-family: var(--font-display); font-weight: 700; font-size: 1.7em; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stat .mid small { font-size: .55em; color: var(--fg-soft); margin-left: .25em; font-weight: 400; }
  .stat .st { font-size: .9em; color: var(--fg-soft); margin-left: -1em; align-self: flex-end; margin-bottom: .35em; }
  .stat > div { min-width: 0; }
  .wait { flex: 1; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 1em; color: var(--fg-soft); font-size: .9em; }
  .wait .bar { width: 40%; height: .25em; border-radius: 1em; background: var(--line); overflow: hidden; position: relative; }
  .wait .bar::after { content: ""; position: absolute; inset: 0 auto 0 0; width: 35%; border-radius: inherit; background: var(--accent-3); animation: slide calc(1.1s / var(--speed)) ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
  .res.pending .wait { display: flex; }
  .res.pending .stat, .res.pending .code, .res.pending .sec { display: none; }
  .res.idle .code { visibility: hidden; }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script src="../_shared/core.js"></script>
<script src="../_shared/player.js"></script>
<script src="config.js"></script>
<script src="page.js"></script>
</body>
</html>
