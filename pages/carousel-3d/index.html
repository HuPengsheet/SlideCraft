<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D 轮播</title>
<link rel="stylesheet" href="../_shared/themes.css">
<link rel="stylesheet" href="../_shared/base.css">
<style>
  .stage { background: radial-gradient(ellipse at 50% 38%, var(--surface) 0%, var(--bg) 70%); user-select: none; -webkit-user-select: none; }
  .head { position: absolute; left: 4em; top: 2.6em; z-index: 3; pointer-events: none; }
  .head .sc-eyebrow { color: var(--accent); }
  .head h1 { font-family: var(--font-display); font-weight: 800; font-size: 2.2em; line-height: 1.1; margin: .2em 0 0; letter-spacing: -.01em; }
  .scene { position: absolute; left: 0; right: 0; top: 4.5em; height: 22em; perspective: 78em; perspective-origin: 50% 40%; cursor: grab; touch-action: pan-y; }
  .scene.drag { cursor: grabbing; }
  .card { position: absolute; left: 50%; top: 50%; width: 22em; height: 12.4em; margin: -6.2em 0 0 -11em; border-radius: .7em; overflow: hidden;
    background: var(--surface); border: 1px solid var(--line); box-shadow: 0 1.6em 3em -1em rgba(0,0,0,.55);
    will-change: transform, opacity; -webkit-box-reflect: below .5em linear-gradient(transparent 62%, rgba(255,255,255,.16)); }
  .scene.ring .card { -webkit-box-reflect: none; backface-visibility: visible; }
  .card img, .card video { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
  .card::after { content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
    background: linear-gradient(115deg, rgba(255,255,255,.18), transparent 38%); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
  .card.side { cursor: pointer; }
  .info { position: absolute; left: 0; right: 0; bottom: 3.4em; text-align: center; z-index: 3; height: 6.6em; pointer-events: none; }
  .info .t { font-family: var(--font-display); font-weight: 700; font-size: 2.1em; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 4em;
    transition: opacity calc(.45s / var(--speed)) ease, transform calc(.55s / var(--speed)) cubic-bezier(.2,.7,.2,1); }
  .info .n { margin-top: .4em; color: var(--fg-soft); font-size: 1.05em; padding: 0 8em; min-height: 1.4em;
    transition: opacity calc(.45s / var(--speed)) ease calc(.06s / var(--speed)), transform calc(.55s / var(--speed)) cubic-bezier(.2,.7,.2,1) calc(.06s / var(--speed)); }
  .info.swap .t, .info.swap .n { opacity: 0; transform: translateY(.6em); }
  .dots { position: absolute; left: 0; right: 0; bottom: 1.6em; display: flex; justify-content: center; gap: .55em; z-index: 3; }
  .dots i { width: .5em; height: .5em; border-radius: 1em; background: var(--line); transition: width calc(.4s / var(--speed)), background calc(.4s / var(--speed)); cursor: pointer; }
  .dots i.on { width: 1.8em; background: var(--accent); }
  .count { position: absolute; right: 4em; top: 2.9em; z-index: 3; font-family: var(--font-mono); font-size: .9em; color: var(--fg-soft); letter-spacing: .12em; font-variant-numeric: tabular-nums; pointer-events: none; }
  .count b { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script src="../_shared/core.js"></script>
<script src="../_shared/player.js"></script>
<script src="config.js"></script>
<script src="page.js"></script>
</body>
</html>
