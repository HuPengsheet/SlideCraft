<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>轨道地图</title>
<link rel="stylesheet" href="../_shared/themes.css">
<link rel="stylesheet" href="../_shared/base.css">
<style>
  :root { --sh: color-mix(in srgb, var(--page-bg) 88%, transparent); }
  .stage { background: radial-gradient(ellipse 55% 75% at 50% 52%, color-mix(in srgb, var(--accent) 9%, var(--bg)), var(--bg) 72%); }
  .head { position: absolute; left: 3.2em; top: 2.8em; z-index: 12; max-width: 28em; }
  .head .sc-title { font-size: 2em; }
  .head .sc-sub { font-size: .9em; }

  svg.map { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; overflow: visible; }
  .ring .line { fill: none; stroke: var(--rc); stroke-opacity: .42; stroke-width: .14; stroke-dasharray: 1; stroke-dashoffset: 1; }
  .ring .band { fill: none; stroke: var(--rc); stroke-width: 2.6; opacity: 0; transition: opacity calc(1.2s / var(--speed)); }
  .ring.draw .line { stroke-dashoffset: 0; transition: stroke-dashoffset calc(1.5s / var(--speed)) cubic-bezier(.3,.7,.2,1); }
  .ring.draw .band { opacity: .06; }
  .beam { stroke: var(--rc); stroke-width: .14; stroke-dasharray: .7 .7; opacity: 0; transition: opacity .3s; }
  .beam.on { opacity: .7; }

  .core { position: absolute; left: 50%; z-index: 5; width: 5.6em; height: 5.6em; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: .4em;
    background: var(--surface); border: 1px solid var(--accent); opacity: 0; transform: translate(-50%, -50%) scale(.4);
    box-shadow: 0 0 0 .5em color-mix(in srgb, var(--accent) 12%, transparent), 0 0 0 1.1em color-mix(in srgb, var(--accent) 6%, transparent), 0 1em 2.4em var(--sh); }
  .core.on { animation: corein calc(1s / var(--speed)) cubic-bezier(.2,.8,.2,1) forwards; }
  .core::before { content: ""; position: absolute; inset: -1px; border-radius: 50%; border: 1px solid var(--accent); opacity: 0; pointer-events: none; }
  .core.on::before { animation: halo calc(3.4s / var(--speed)) ease-out infinite; }
  .core b { font-family: var(--font-display); font-size: 1em; line-height: 1.15; overflow-wrap: anywhere; }
  .core small { color: var(--fg-soft); font-size: .62em; margin-top: .25em; line-height: 1.2; overflow-wrap: anywhere; }
  @keyframes corein { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.4); } 60% { opacity: 1; transform: translate(-50%, -50%) scale(1.12); } 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
  @keyframes halo { 0% { opacity: .55; transform: scale(1); } 100% { opacity: 0; transform: scale(2.1); } }

  .sat { position: absolute; width: 3em; height: 3em; z-index: 7; }
  .sat .in { width: 100%; height: 100%; opacity: 0; transform: scale(.3); transition: opacity calc(.6s / var(--speed)), transform calc(.7s / var(--speed)) cubic-bezier(.2,1.3,.4,1); }
  .sat.on .in { opacity: 1; transform: none; }
  .sat.on.hl .in { transform: scale(1.18); }
  .dot { width: 100%; height: 100%; border-radius: 50%; display: grid; place-items: center; background: var(--surface); color: var(--rc);
    border: 1px solid color-mix(in srgb, var(--rc) 55%, var(--line)); font-family: var(--font-display); font-weight: 700; font-size: 1.05em; line-height: 1;
    box-shadow: 0 .5em 1.1em var(--sh); transition: background .25s, color .25s, box-shadow .25s; cursor: default; }
  .sat.hl { opacity: 1 !important; z-index: 9 !important; }
  .sat.hl .dot { background: var(--rc); color: var(--bg); box-shadow: 0 0 0 .4em color-mix(in srgb, var(--rc) 22%, transparent), 0 .6em 1.4em var(--sh); }
  .lab { position: absolute; top: calc(100% + .3em); left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: .78em; color: var(--fg-soft); padding: .08em .5em; border-radius: 1em;
    background: color-mix(in srgb, var(--bg) 78%, transparent); transition: opacity .25s, color .25s; }
  .sat.hl .lab { color: var(--fg); }
  .lh .lab { opacity: 0; }
  .lh .sat.hl .lab { opacity: 1; }

  .card { position: absolute; left: 3em; bottom: 3em; width: 11.5em; z-index: 12; padding: 1em 1.1em 1.1em; background: var(--surface); border: 1px solid var(--line); border-top: .2em solid var(--rc, var(--accent));
    border-radius: .8em; box-shadow: 0 1em 2.4em var(--sh); opacity: 0; transform: translateY(.6em); transition: opacity .35s, transform .35s; pointer-events: none; }
  .card.on { opacity: 1; transform: none; }
  .ci.pop { animation: cardin calc(.5s / var(--speed)) cubic-bezier(.2,.8,.2,1); }
  @keyframes cardin { from { opacity: 0; transform: translateY(.5em); } to { opacity: 1; transform: none; } }
  .k { display: flex; align-items: center; gap: .5em; font-size: .62em; letter-spacing: .16em; text-transform: uppercase; color: var(--rc, var(--accent)); }
  .k i { font-style: normal; display: inline-grid; place-items: center; min-width: 1.9em; height: 1.9em; padding: 0 .3em; border-radius: 1em; border: 1px solid currentColor; letter-spacing: 0; }
  .t { font-family: var(--font-display); font-weight: 700; font-size: 1.3em; line-height: 1.2; margin-top: .45em; }
  .n { margin: .4em 0 0; color: var(--fg-soft); font-size: .82em; line-height: 1.55; }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script src="../_shared/core.js"></script>
<script src="../_shared/player.js"></script>
<script src="config.js"></script>
<script src="page.js"></script>
</body>
</html>
