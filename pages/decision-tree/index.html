<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>决策树</title>
<link rel="stylesheet" href="../_shared/themes.css">
<link rel="stylesheet" href="../_shared/base.css">
<style>
  .head { position: absolute; left: 4em; top: 2.3em; z-index: 3; }
  .head .sc-title { font-size: 2em; }
  .world { position: absolute; transform-origin: 0 0; }
  svg.lk { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .e { fill: none; stroke: var(--line); stroke-width: .16; stroke-linecap: round; opacity: 0; transition: opacity .4s, stroke .4s; }
  .e.show { opacity: 1; }
  .e.act { stroke: var(--accent); stroke-width: .28; }
  .ol { position: absolute; transform: translate(-50%, -50%); max-width: 6em; padding: .1em .7em; font-size: .75em; border-radius: 1em; background: var(--bg); border: 1px solid var(--line); color: var(--fg-soft);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0; pointer-events: none; z-index: 2; transition: opacity .4s, background .3s, color .3s, border-color .3s; }
  .ol.show { opacity: 1; pointer-events: auto; cursor: pointer; }
  .ol.act { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 700; }
  .ol.show:not(.act):hover { border-color: var(--accent); color: var(--fg); }
  .nd { position: absolute; z-index: 1; display: flex; flex-direction: column; justify-content: center; gap: .15em; padding: .4em .9em; border-radius: .8em; background: var(--surface); border: 1px solid var(--line);
    opacity: 0; transform: translateX(-1em) scale(.94); pointer-events: none;
    transition: opacity calc(.5s / var(--speed)), transform calc(.55s / var(--speed)) cubic-bezier(.2,1.2,.4,1), border-color .4s, box-shadow .4s, background .4s; }
  .nd.show { opacity: .6; transform: none; pointer-events: auto; cursor: pointer; }
  .nd.show:hover { opacity: .9; }
  .nd .k { font-size: .6em; letter-spacing: .16em; color: var(--fg-soft); }
  .nd .t { font-family: var(--font-display); font-weight: 600; font-size: .88em; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .nd .d { font-size: .68em; color: var(--fg-soft); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .nd.act { opacity: 1; border-color: var(--c); background: color-mix(in srgb, var(--c) 14%, var(--surface)); box-shadow: 0 .5em 1.4em color-mix(in srgb, var(--c) 30%, transparent); cursor: default; }
  .nd.act .k { color: var(--c); }
  .nd.res { border-style: dashed; }
  .nd.res.act { border-style: solid; box-shadow: 0 0 1.8em -.2em var(--c), 0 .5em 1.4em color-mix(in srgb, var(--c) 30%, transparent); }
  .crumb { position: absolute; left: 4em; right: 6em; bottom: 1.6em; font-size: .8em; color: var(--fg-soft); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; opacity: 0; transition: opacity .5s; }
  .crumb.show { opacity: 1; }
  .crumb b { color: var(--accent); font-weight: 600; }
  .hint { position: absolute; right: 4em; top: 2.6em; font-size: .7em; letter-spacing: .12em; color: var(--fg-soft); opacity: 0; transition: opacity .6s; }
  .hint.show { opacity: .9; }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script src="../_shared/core.js"></script>
<script src="../_shared/player.js"></script>
<script src="config.js"></script>
<script src="page.js"></script>
</body>
</html>
