<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>媒体墙</title>
<link rel="stylesheet" href="../_shared/themes.css">
<link rel="stylesheet" href="../_shared/base.css">
<style>
  .stage { display: flex; flex-direction: column; padding: 2em 3em 2.4em; gap: 1.2em; }
  .head { display: flex; align-items: baseline; gap: 1.2em; min-height: 0; }
  .head:empty { display: none; }
  .head .sc-title { font-size: 1.9em; }
  .head .sc-sub { margin: 0; }
  .head .cnt { margin-left: auto; font-size: .85em; color: var(--fg-soft); font-variant-numeric: tabular-nums; }
  .area { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  .wall { display: grid; grid-template-columns: repeat(var(--cols, 4), 1fr); gap: var(--gap, .9em); }

  .card { position: relative; aspect-ratio: var(--ar, 16 / 9); border-radius: .6em; overflow: hidden; cursor: pointer; padding: 0; border: 1px solid var(--line); background: var(--surface); color: inherit; font: inherit;
    transform: perspective(60em) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) translateY(var(--lift, 0em)) scale(var(--s, 1));
    opacity: 0; translate: 0 1.6em; scale: .96;
    transition: opacity .6s, translate .7s cubic-bezier(.2,.7,.2,1), scale .7s cubic-bezier(.2,.7,.2,1), transform .5s cubic-bezier(.2,.7,.2,1), box-shadow .35s, filter .35s; }
  .card.in { opacity: 1; translate: 0 0; scale: 1; }
  .sway .card.in { animation: sway calc((4.5s + var(--c) * .6s + var(--r) * .4s) / var(--speed)) ease-in-out infinite alternate; animation-delay: calc(var(--i) * -.9s); }
  .card:hover { transition: opacity .6s, translate .7s, scale .7s, transform .12s ease-out, box-shadow .35s, filter .35s; animation-play-state: paused !important; }
  @keyframes sway { from { rotate: -.5deg; } to { rotate: .5deg; } }

  .card > img, .card > video { width: 100%; height: 100%; display: block; object-fit: var(--fit, cover); transition: scale .6s cubic-bezier(.2,.7,.2,1); }
  .card:hover > img, .card:hover > video { scale: 1.07; }
  .card .glare { position: absolute; inset: 0; pointer-events: none; opacity: 0; mix-blend-mode: soft-light; transition: opacity .3s;
    background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), rgba(255,255,255,.5), transparent 55%); }
  .card:hover .glare { opacity: 1; }
  .card .no { position: absolute; top: .5em; left: .6em; font-size: .6em; letter-spacing: .08em; padding: .15em .6em; border-radius: 99em; background: var(--bg); color: var(--fg); opacity: .75; }
  .card .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 2em .8em .6em; text-align: left; opacity: 0; transform: translateY(.5em); transition: .3s; color: var(--fg);
    background: linear-gradient(to top, var(--bg), transparent); }
  .card .cap b { display: block; font-size: .85em; font-weight: 600; }
  .card .cap span { font-size: .65em; color: var(--fg-soft); }
  .card:hover .cap { opacity: 1; transform: none; }
  .wall:hover .card.in { filter: brightness(.6) saturate(.85); }
  .wall .card.in:hover { --lift: -.4em; --s: 1.03; filter: none; z-index: 2; box-shadow: 0 1.4em 3em rgba(0,0,0,.45); }
  .card:focus-visible { outline: .15em solid var(--accent); outline-offset: .15em; }

  .lb { position: absolute; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(.6em); }
  .lb.on { display: flex; animation: fadein .25s; }
  .lb figure { margin: 0; max-width: 90%; max-height: 90%; display: flex; flex-direction: column; align-items: center; gap: .9em; }
  .lb figure > img, .lb figure > video { max-width: 100%; max-height: calc(var(--u) * 41); border-radius: .5em; box-shadow: 0 2em 5em rgba(0,0,0,.5); }
  .lb figcaption { font-size: 1.05em; }
  .lb figcaption span { color: var(--fg-soft); margin-left: .7em; font-size: .85em; }
  .lb figure > .go-next { animation: slideN .35s cubic-bezier(.2,.7,.2,1); }
  .lb figure > .go-prev { animation: slideP .35s cubic-bezier(.2,.7,.2,1); }
  .lb button { position: absolute; width: 3em; height: 3em; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font-size: 1em; cursor: pointer; }
  .lb button:hover { border-color: var(--accent); color: var(--accent); }
  .lb .prev { left: 1.5em; } .lb .next { right: 1.5em; } .lb .close { top: 1.2em; right: 1.5em; }
  .hint { position: absolute; left: 0; right: 0; bottom: .8em; text-align: center; font-size: .65em; color: var(--fg-soft); }
  @keyframes fadein { from { opacity: 0; } }
  @keyframes slideN { from { opacity: 0; transform: translateX(3em) scale(.97); } }
  @keyframes slideP { from { opacity: 0; transform: translateX(-3em) scale(.97); } }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script src="../_shared/core.js"></script>
<script src="../_shared/player.js"></script>
<script src="config.js"></script>
<script src="page.js"></script>
</body>
</html>
