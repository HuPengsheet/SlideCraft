<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>波纹点阵</title>
<link rel="stylesheet" href="../_shared/themes.css">
<link rel="stylesheet" href="../_shared/base.css">
<style>
  .stage { background: var(--bg); }
  .rg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; opacity: 0; transition: opacity calc(1.2s / var(--speed)) ease; }
  .rg.on { opacity: 1; }
  .veil { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(to right, var(--bg) 0%, transparent 46%), radial-gradient(ellipse at 50% 50%, transparent 55%, var(--bg) 140%); opacity: .85; }
  .copy { position: absolute; left: 4.4em; bottom: 4em; max-width: 26em; pointer-events: none; }
  .copy > * { opacity: 0; transform: translateY(.6em); transition: opacity calc(1s / var(--speed)) ease, transform calc(1s / var(--speed)) cubic-bezier(.2,.7,.2,1); }
  .copy.on > * { opacity: 1; transform: none; }
  .copy .sc-eyebrow { transition-delay: calc(.2s / var(--speed)); }
  .copy h1 { font-family: var(--font-display); font-weight: 800; font-size: 3.6em; line-height: 1.05; margin: .3em 0 0; letter-spacing: -.02em; text-wrap: balance; transition-delay: calc(.35s / var(--speed)); }
  .copy p { margin: 1em 0 0; color: var(--fg-soft); font-size: 1.05em; transition-delay: calc(.55s / var(--speed)); }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script src="../_shared/core.js"></script>
<script src="../_shared/player.js"></script>
<script src="config.js"></script>
<script src="page.js"></script>
</body>
</html>
