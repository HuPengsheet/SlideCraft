<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>设备相框视频</title>
<link rel="stylesheet" href="../_shared/themes.css">
<link rel="stylesheet" href="../_shared/base.css">
<style>
  .stage { display: flex; align-items: center; justify-content: center;
    background: radial-gradient(65% 85% at 50% 55%, color-mix(in srgb, var(--accent) 12%, var(--bg)), var(--bg) 70%); }
  .head { position: absolute; top: 2.2em; left: 3em; right: 3em; text-align: center; transition: opacity calc(.8s / var(--speed)), transform calc(.8s / var(--speed)); opacity: 0; transform: translateY(-.8em); }
  .head.in { opacity: 1; transform: none; }
  .head h1 { margin: 0; font-family: var(--font-display); font-size: 1.9em; line-height: 1.15; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .head p { margin: .35em 0 0; color: var(--fg-soft); font-size: .95em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .scene { --sw: 28em; --ar: 16 / 10; --pad: .7em; position: relative; perspective: 80em; margin-top: 2.6em;
    opacity: 0; transform: translateY(2em) scale(.92); transition: opacity calc(.9s / var(--speed)) ease-out, transform calc(1.1s / var(--speed)) cubic-bezier(.2,.8,.2,1); }
  .scene.in { opacity: 1; transform: none; }
  .scene.tv { --sw: 31em; --ar: 16 / 9; --pad: .45em; }
  .scene.phone { --sw: 11.2em; --ar: 9 / 19.5; --pad: .55em; }
  .float { animation: float calc(6s / var(--speed)) ease-in-out infinite alternate; }
  .scene.nofloat .float { animation: none; }
  @keyframes float { from { transform: translateY(-.5em); } to { transform: translateY(.6em); } }
  .rig { transform-style: preserve-3d; transform: rotateY(calc(var(--ry, -12) * 1deg)) rotateX(calc(var(--rx, 5) * 1deg)); transition: transform calc(.5s / var(--speed)) ease-out; }

  .dev { position: relative; display: flex; flex-direction: column; align-items: center; filter: drop-shadow(0 2em 2.4em color-mix(in srgb, var(--fg) 22%, transparent)); }
  .bezel { position: relative; padding: var(--pad); background: var(--surface); border: .12em solid var(--line); border-radius: .9em; box-shadow: inset 0 0 0 .08em color-mix(in srgb, var(--fg) 8%, transparent); }
  .phone .bezel { border-radius: 1.9em; border-width: .2em; }
  .tv .bezel { border-radius: .5em; }
  .screenwrap { position: relative; width: var(--sw); aspect-ratio: var(--ar); }
  .screen { position: absolute; inset: 0; overflow: hidden; background: var(--bg); border-radius: .35em; }
  .phone .screen { border-radius: 1.4em; }
  .tv .screen { border-radius: .15em; }
  .screen::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(115deg, color-mix(in srgb, #fff 14%, transparent), transparent 38%); }
  .lay { position: absolute; inset: 0; opacity: 0; transition: opacity calc(.8s / var(--speed)); }
  .lay.on { opacity: 1; }
  .lay img, .lay video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ph { position: absolute; inset: 0; padding: 8% 7%; display: flex; flex-direction: column; gap: .7em; background: linear-gradient(150deg, color-mix(in srgb, var(--accent) 22%, var(--surface)), var(--surface)); }
  .ph i { display: block; height: .9em; border-radius: .45em; background: color-mix(in srgb, var(--fg) 14%, transparent); }
  .ph i:nth-child(1) { width: 45%; height: 1.4em; background: color-mix(in srgb, var(--accent) 55%, transparent); }
  .ph i:nth-child(2) { width: 80%; } .ph i:nth-child(3) { width: 62%; } .ph i:nth-child(4) { flex: 1; max-height: 40%; margin-top: .4em; border-radius: .7em; }
  .notch { position: absolute; z-index: 4; top: calc(var(--pad) + .5em); left: 50%; width: 3em; height: .8em; margin-left: -1.5em; background: var(--line); border-radius: 1em; }
  .cam { position: absolute; top: calc(var(--pad) / 2 - .12em); left: 50%; width: .25em; height: .25em; margin-left: -.12em; border-radius: 50%; background: var(--line); }

  .base { width: calc(var(--sw) * 1.14); height: .85em; margin-top: -.05em; border-radius: 0 0 1.2em 1.2em / 0 0 .8em .8em; background: linear-gradient(var(--line), var(--surface) 70%); border: .1em solid var(--line); border-top: 0; position: relative; }
  .base::before { content: ""; position: absolute; left: 50%; top: 0; width: 5em; height: .3em; margin-left: -2.5em; border-radius: 0 0 .5em .5em; background: color-mix(in srgb, var(--fg) 12%, var(--line)); }
  .stand { width: 5em; height: 1.6em; background: linear-gradient(var(--line), var(--surface)); clip-path: polygon(20% 0, 80% 0, 100% 100%, 0 100%); }
  .foot { width: 11em; height: .5em; border-radius: .3em; background: var(--line); }

  /* 标注 */
  .co { --out: 2.4em; position: absolute; left: 0; top: calc(var(--y) * 1%); width: 100%; height: 0; z-index: 6; pointer-events: none; }
  .co .dot { position: absolute; left: calc(var(--x) * 1%); top: 0; width: .9em; height: .9em; margin: -.45em 0 0 -.45em; border-radius: 50%; background: var(--accent); border: .15em solid var(--bg); box-shadow: 0 0 0 .2em color-mix(in srgb, var(--accent) 40%, transparent); transform: scale(0); transition: transform calc(.45s / var(--speed)) cubic-bezier(.3,1.6,.5,1); }
  .co .dot::after { content: ""; position: absolute; inset: -.45em; border-radius: 50%; border: .1em solid var(--accent); opacity: 0; }
  .co.in .dot { transform: scale(1); }
  .co.in .dot::after { animation: ping calc(2.2s / var(--speed)) ease-out infinite; }
  @keyframes ping { 0% { transform: scale(.6); opacity: .8; } 100% { transform: scale(1.8); opacity: 0; } }
  .co .ln { position: absolute; top: -.04em; height: .09em; background: var(--accent); transform: scaleX(0); transition: transform calc(.5s / var(--speed)) ease-out calc(.2s / var(--speed)); }
  .co.r .ln { left: calc(var(--x) * 1%); width: calc(100% - var(--x) * 1% + var(--out)); transform-origin: left; }
  .co.l .ln { right: calc(100% - var(--x) * 1%); width: calc(var(--x) * 1% + var(--out)); transform-origin: right; }
  .co.in .ln { transform: scaleX(1); }
  .co .lb { position: absolute; top: 0; max-width: 9em; width: max-content; padding: .45em .75em; font-size: .8em; line-height: 1.35; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: .5em; box-shadow: 0 .6em 1.4em color-mix(in srgb, var(--fg) 14%, transparent); overflow-wrap: anywhere; max-height: 5.6em; overflow: hidden; opacity: 0; transition: opacity calc(.4s / var(--speed)) calc(.5s / var(--speed)), transform calc(.5s / var(--speed)) calc(.5s / var(--speed)); }
  .co.r .lb { left: calc(100% + var(--out) + .3em); transform: translate(-.8em, -50%); }
  .co.l .lb { right: calc(100% + var(--out) + .3em); transform: translate(.8em, -50%); }
  .co.in .lb { opacity: 1; }
  .co.r.in .lb, .co.l.in .lb { transform: translate(0, -50%); }
  .co .lb b { color: var(--accent); }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script src="../_shared/core.js"></script>
<script src="../_shared/player.js"></script>
<script src="config.js"></script>
<script src="page.js"></script>
</body>
</html>
