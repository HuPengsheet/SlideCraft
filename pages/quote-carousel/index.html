<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>引言轮播</title>
<link rel="stylesheet" href="../_shared/themes.css">
<link rel="stylesheet" href="../_shared/base.css">
<style>
  .stage {
    display: flex; flex-direction: column; padding: 3em 5.5em 2.6em;
    background:
      radial-gradient(52em 32em at 90% -10%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 70%),
      radial-gradient(46em 30em at -8% 112%, color-mix(in srgb, var(--accent-3) 12%, transparent), transparent 70%),
      var(--bg);
  }
  .top { flex: none; display: flex; justify-content: space-between; align-items: baseline; min-height: 1.4em; }
  .top .sc-eyebrow { font-size: .8em; }
  .top .cnt { font-family: var(--font-mono); font-size: .85em; color: var(--fg-soft); font-variant-numeric: tabular-nums; }
  .top .cnt b { color: var(--fg); font-weight: 600; }
  .main { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; position: relative; }

  .slide { width: 100%; display: flex; position: relative; }
  .center .slide { flex-direction: column; align-items: center; text-align: center; padding: 0 3em; }
  .qm { font-family: var(--font-display); font-weight: 700; line-height: .7; color: var(--accent); user-select: none; animation: qm calc(.9s / var(--speed)) cubic-bezier(.2,.8,.2,1) both; }
  .center .qm { font-size: 9em; height: .5em; margin-bottom: .1em; }
  @keyframes qm { from { opacity: 0; transform: translateY(.5em) scale(.7) rotate(-6deg); } to { opacity: .95; transform: none; } }
  .q { font-family: var(--font-display); font-weight: 600; letter-spacing: -.005em; margin: 0; max-width: 100%; }
  .q.s1 { font-size: 3.2em; line-height: 1.25; } .q.s2 { font-size: 2.6em; line-height: 1.3; }
  .q.s3 { font-size: 2.1em; line-height: 1.38; } .q.s4 { font-size: 1.7em; line-height: 1.5; }
  .center .q { max-width: 46em; }
  .w { display: inline-block; opacity: 0; transform: translateY(.35em); filter: blur(.25em);
       transition: opacity calc(.5s / var(--speed)), transform calc(.6s / var(--speed)) cubic-bezier(.2,.8,.2,1), filter calc(.5s / var(--speed)); }
  .w.on { opacity: 1; transform: none; filter: none; }
  .sp { display: inline; white-space: pre-wrap; }

  .by { display: flex; align-items: center; gap: .9em; margin-top: 2em; opacity: 0; transform: translateX(-1.6em); transition: opacity calc(.7s / var(--speed)), transform calc(.8s / var(--speed)) cubic-bezier(.2,.8,.2,1); }
  .by.on { opacity: 1; transform: none; }
  .center .by { margin-top: 2.2em; }
  .av { flex: none; width: 3.2em; height: 3.2em; border-radius: 50%; overflow: hidden; display: grid; place-items: center; box-shadow: 0 0 0 .2em var(--bg), 0 0 0 .3em var(--line); }
  .av img { width: 100%; height: 100%; object-fit: cover; }
  .av span { font-family: var(--font-display); font-weight: 700; font-size: 1.1em; color: var(--bg); }
  .bl { display: flex; flex-direction: column; text-align: left; line-height: 1.3; }
  .bl b { font-family: var(--font-display); font-size: 1.15em; }
  .bl i { font-style: normal; color: var(--fg-soft); font-size: .85em; }
  .bl::before { content: ""; display: none; }

  /* split：左侧填色面板 + 右侧引文 */
  .split .slide { align-items: stretch; gap: 0; height: 100%; max-height: 27em; border-radius: 1.4em; overflow: hidden; border: 1px solid var(--line);
    background: var(--surface); box-shadow: 0 .1em .2em color-mix(in srgb, var(--fg) 6%, transparent), 0 2em 3em -1.4em color-mix(in srgb, var(--fg-soft) 50%, transparent); }
  .split .pane { flex: none; width: 30%; position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; padding: 1.8em;
    background: radial-gradient(90% 80% at 100% 0%, color-mix(in srgb, var(--accent-2) 55%, transparent), transparent 70%), var(--accent); color: var(--bg); }
  .split .qm { font-size: 11em; height: .55em; color: var(--bg); opacity: .9; }
  .split .by { margin-top: 0; }
  .split .pane .bl i { color: color-mix(in srgb, var(--bg) 72%, transparent); }
  .split .pane .av { box-shadow: 0 0 0 .2em var(--accent), 0 0 0 .3em color-mix(in srgb, var(--bg) 40%, transparent); }
  .split .body { flex: 1; min-width: 0; display: flex; align-items: center; padding: 2.4em 3em; }
  .split .q { max-width: 100%; }

  .foot { flex: none; display: flex; flex-direction: column; gap: 1.1em; }
  .bars { display: flex; gap: .5em; }
  .bar { flex: 1; height: .18em; border-radius: 1em; background: var(--line); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); transform: scaleX(0); transform-origin: left; }
  .bar.done i { transform: none; }
  .bar.run i { animation: fill linear both; animation-duration: calc(var(--hold) / var(--speed)); }
  @keyframes fill { to { transform: none; } }
  .nav { display: flex; align-items: center; justify-content: space-between; min-height: 1.6em; }
  .dots { display: flex; gap: .5em; align-items: center; }
  .dot { width: .75em; height: .75em; padding: 0; border: 0; border-radius: 1em; background: var(--line); cursor: pointer; transition: width .4s cubic-bezier(.2,.8,.2,1), background .3s; }
  .dot:hover { background: var(--fg-soft); }
  .dot.cur { width: 2.2em; background: var(--accent); }
  .dot:focus-visible, .arr:focus-visible { outline: .15em solid var(--accent-3); outline-offset: .2em; }
  .arrs { display: flex; gap: .5em; }
  .arr { width: 2.2em; height: 2.2em; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--fg); display: grid; place-items: center; cursor: pointer; padding: 0; transition: border-color .3s, transform .3s; }
  .arr:hover { border-color: var(--accent); transform: scale(1.08); }
  .arr svg { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script src="../_shared/core.js"></script>
<script src="../_shared/player.js"></script>
<script src="config.js"></script>
<script src="page.js"></script>
</body>
</html>
